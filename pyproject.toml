[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant-engine"
version = "0.1.0"
description = "Credit agreement PDF -> checked covenant abstract -> human sign-off. Engine for the Covenant Agent (AgentCore + MCP App)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "jsonschema>=4.20", "pyyaml>=6.0"]

[project.optional-dependencies]
render = ["playwright>=1.45"]          # EDGAR HTML -> PDF (scripts/fetch_filings.py)
dev = ["pytest>=8", "openpyxl>=3.1"]
xlsx = ["openpyxl>=3.1"]               # Excel compliance workbook (covenant_engine.export_xlsx)
aws = ["boto3>=1.34"]
mcp = ["mcp>=2.3,<3"]                # MCP server (covenant_engine.mcp_server)                 # S3-triggered intake handler (ingest/handler.py)

[project.scripts]
covenant-mcp = "covenant_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
covenant_engine = ["ui/*.html", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls models (claude -p); run with -m live", "data: needs fetched filings and intake bundles (scripts/fetch_filings.py)"]
addopts = "-m 'not live'"
