# ---------------------------------------------------------------- judgment flags
flags:
  - id: F1
    topic: Which schedule applies on Jun 30 2026
    issue: "The 10-K (Sep 2025) and 10-Qs through Mar 2026 describe the a5 schedule (4.25x for Mar-Sep 2026, 3.75x from Sep 2027). The 6th Amendment (Jun 3 2026) raised Jun 30 and Sep 30 2026 to 4.75x and moved every later step. An abstract built from the 10-K or a5 uses the wrong cap. Reported 3.17x passes under either (checker reported-only test vs 4.75x: pass, headroom 33.26%)."
    impact: "caps: a6 4.75x vs a5 4.25x for 2026-06-30 and 2026-09-30; 4.50x vs 4.00x Dec-26..Jun-27; 4.25x vs 3.75x Sep-27..Mar-28"
    owner: setup_agent (date logic) + human sign-off
  - id: F2
    topic: Letters of credit in Funded Debt
    issue: "Indebtedness clause (b) counts the MAXIMUM amount of LCs, drawn or undrawn, and clause (b) is pulled into Funded Debt. Since a6 only surety bonds and surety-backed LCs are carved out. ROAD reports $4.8M of LCs (mainly insurance); whether the borrower includes them is unknown."
    impact: "not computed (immaterial-looking vs. $1.8B of term/revolver debt, but the reading must be pinned)"
    owner: credit_officer
  - id: F3
    topic: Blackline-only conformed copies
    issue: "Neither a5 nor a6 is a clean conformed copy. Struck and inserted text are interleaved in the HTML; a naive text extract reads the NLR row as '4. 2 7 5 to 1.00'. Any agent that does not parse strike/underline styles will mis-read the schedule, the step-up level (4.00 vs 4.25), the step-up start (Sep-27 vs Jun-28) and Material Acquisition ($75M vs $100M)."
    impact: "schedule and election terms wrong if read naively"
    owner: setup_agent (document parsing) + human sign-off
  - id: F4
    topic: Qualifying Cash eligibility
    issue: "Cap is no longer binding at ROAD's size (greater of $325M and 50% of EBITDA vs $94.5M consolidated cash), but eligibility is: only domestic, qualifying-bank, agent-lien-only accounts count. Cash at the captive insurer and any foreign or encumbered cash should be excluded. Account detail is not public."
    impact: "not computed"
    owner: request compliance certificate
  - id: F5
    topic: Interest Charges gross vs net
    issue: "Consolidated Interest Charges is gross (no interest income netting) and includes fees, premium and debt discount 'treated as interest'. ROAD reports 'interest expense, net' and has a $300M swap whose realized gains run through interest. ICR replay needs the certificate."
    owner: request compliance certificate
  - id: F6
    topic: Uncapped / discretionary add-backs
    issue: "(x) agent-approved non-recurring costs have no cap; (xi) terminal run-rate needs agent approval; (vii) is capped at 15% of pre-(vii) EBITDA with an itemised schedule. None of the amounts are disclosed."
    owner: credit_officer
  - id: F7
    topic: Step-up mechanics
    issue: "Leverage Step-Up is available only from Jun 30 2028, at 4.25x (just 0.25x above the 4.00x floor), for four quarters, with no stated limit on the number of elections and no cool-off. Requires a $100M+ Material Acquisition (trailing 4 quarters, post-5th-Amendment deals only) and notice 5 Business Days before closing."
    owner: credit_officer
  - id: F8
    topic: Term Loan B carries no maintenance covenant
    issue: "VERIFIED: TLB 9.16 is '[Reserved]'. TLB lenders rely on cross-acceleration (only after revolver lenders accelerate) and on incurrence tests. TLB references the TLA/RCF agreement 'as amended from time to time', so TLA/RCF covenant amendments (like a6) flow into the TLB's acquisition test without TLB lender consent."
    owner: credit_officer
  - id: F9
    topic: Inconsistent historical disclosure
    issue: "Sep 30 2024 NLR is 1.81x in the 10-K but 1.80x in the Jun 2025 10-Q; the 10-K risk factor still says the agreement requires a 'fixed charge coverage ratio' (replaced by ICR in Jun 2025)."
    src: k
    quote: "The Term Loan A / Revolver Credit Agreement also requires us to maintain a fixed charge coverage ratio and a consolidated leverage ratio"
    owner: note only
  - id: F10
    topic: Missing amendments 1-4
    issue: "Amendments 1 (Nov 2022), 2 (May 2023), 3 (May 2024), 4 (Oct 2024) and the Nov 2022 Consent are not in the folder. a5's struck text proves covenant text changed between 2022 and a5 (3.50x flat -> step schedule peaking at 4.50x; Holdback carve-outs). Current text does not depend on them because a6 restates the whole agreement, but back-testing quarters before Jun 30 2025 does."
    owner: request from EDGAR (8-K/10-Q exhibits)
  - id: F11
    topic: Depletion and accretion in D&A
    issue: "EBITDA adds back 'depreciation and amortization expense'. ROAD's line is 'depreciation, depletion, accretion and amortization' (mineral reserves, ARO). Whether depletion/accretion are added back is a reading call."
    owner: credit_officer
  - id: F12
    topic: Drafting defect in terminal definitions
    src: a6
    issue: "'Specified Liquid Asphalt Terminal Completion Quarter' refers to an undefined 'Specified Asphalt Termination Certification' (intended: Specified Liquid Asphalt Terminal Certification)."
    quote: "the Fiscal Quarter during which the Administrative Agent has received the Specified Asphalt Termination Certification for such liquid asphalt terminal"
    owner: note only
  - id: F13
    topic: Restricted group = whole consolidated group
    issue: "No Unrestricted Subsidiary concept in the TLA/RCF; the only carve-out is the captive insurer (1.3(d)). Joint-venture income counts only as cash distributed."
    owner: note only
