# Construction Partners (ROAD) covenant abstract
# The "answer key" the four agent builds are graded against.
# Every quote is checked verbatim against its source by engine/verify_abstract.py.
# Amounts are USD thousands unless stated. Ratios are x:1.00.
#
# READ FIRST - how the current text was established
#   There is no clean conformed copy. Both the 5th (a5) and 6th (a6) amendments attach
#   "Exhibit A - Conformed Copy of the Credit Agreement", but as a BLACKLINE: struck text
#   (red/green line-through) and inserted text (blue/green double underline) are both
#   present in the HTML. The checker strips tags, so a6's searchable text interleaves old
#   and new wording (e.g. "4. 2 7 5 to 1.00" = 4.25 struck, 4.75 inserted).
#   Current text = a6 Exhibit A with struck runs removed. The checker's load_source() now
#   does this (live=True), so ordinary quote fields are checked against CURRENT text.
#   Quotes that deliberately cite deleted wording use keys containing "blackline" and are
#   checked against the raw redline. Live text can still split digits ("4. 7 5 to 1.00").
#   Where possible the clean reading is corroborated by a 10-Q quote (src q2).
#   Provenance per item: `introduced_by:` ca (2022 original) | a1_a4 (missing amendments,
#   inferred because the text is in a5's unmarked/struck base but not in ca) | a5 | a6.

schema_version: 0.1
abstract_id: ROAD-2026-06-30
status: draft            # draft -> verified (code checks pass) -> signed_off (human)
as_of: 2026-06-30        # text current through the Sixth Amendment (Jun 3 2026); TLB through Amendment No. 1 (Jun 18 2026)
built_by: agent (Claude) from public EDGAR filings, 2026-10-10
fiscal_calendar: "fiscal year ends Sep 30; fiscal Q3 FY2026 = quarter ended Jun 30 2026"

sources:
  ca:
    file: data/filings/ROAD/credit_agreement_third-a-r-credit-agreement-2022.htm
    what: Third Amended and Restated Credit Agreement (Term Loan A / Revolver), dated Jun 30 2022, as originally signed
  a5:
    file: data/filings/ROAD/amendment_5th-amendment-2025.htm
    what: Fifth Amendment (Jun 30 2025) with Exhibit A blackline conformed copy (changes vs. text as amended by Amendments 1-4)
  a6:
    file: data/filings/ROAD/amendment_6th-amendment-2026-06.htm
    what: Sixth Amendment (Jun 3 2026) with Exhibit A blackline conformed copy (changes vs. a5 text). CURRENT TEXT of the TLA/RCF agreement
  tlb:
    file: data/filings/ROAD/amendment_term-loan-b-amendment-no-1.htm
    what: Amendment No. 1 (Jun 18 2026) to the separate Term Loan Credit Agreement (TLB, Nov 1 2024), with Exhibit A blackline of the TLB agreement
  q2:
    file: data/filings/ROAD/10-Q_2026-06-30.htm
    what: ROAD 10-Q for the quarter ended Jun 30 2026 (fiscal Q3 FY2026); reported ratios, debt table
  q1:
    file: data/filings/ROAD/10-Q_2026-03-31.htm
    what: ROAD 10-Q for the quarter ended Mar 31 2026 (fiscal Q2 FY2026)
  qd:
    file: data/filings/ROAD/10-Q_2025-12-31.htm
    what: ROAD 10-Q for the quarter ended Dec 31 2025 (fiscal Q1 FY2026)
  qp:
    file: data/filings/ROAD/10-Q_2025-06-30.htm
    what: ROAD 10-Q for the quarter ended Jun 30 2025 (fiscal Q3 FY2025); describes the Fifth Amendment
  k:
