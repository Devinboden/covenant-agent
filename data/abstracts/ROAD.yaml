      - {date: 2025-09-30, ratio: 3.10, cap: 4.50, src: q2, quote: "the Company's consolidated net leverage ratio was 3.17 -to-1.00 and 3.10 -to-1.00, respectively"}
      - {date: 2025-12-31, ratio: 3.18, cap: 4.50, src: qd, quote: "the Company's consolidated net leverage ratio was 3.18 -to-1.00 and 2.96 -to-1.00, respectively"}
      - {date: 2026-03-31, ratio: 3.23, cap: 4.25, src: q1, quote: "the Company's consolidated net leverage ratio was 3.23 -to-1.00 and 3.10 -to-1.00, respectively"}
