  - id: interest_coverage
    name: Consolidated Interest Coverage Ratio
    kind: ratio
    ref: "9.16(b)"
    src: a6
    current_text_from: a6
    introduced_by: "a5 (replaced the 2022 Fixed Charge Coverage Ratio 1.20x); step-down to 2.75x by a6"
    direction: min
    tested: "quarterly, last day of each fiscal quarter (from FQ ending Jun 30 2025)"
    formula: {numerator: consolidated_adjusted_ebitda, denominator: consolidated_interest_charges}
    definition_quote: "“Consolidated Interest Coverage Ratio” means, at any date of determination, the ratio of (a) Consolidated Adjusted EBITDA to (b) Consolidated Interest Charges, in each case, for the most recently ended period of four (4) Fiscal Quarters ending on or most recently prior to such date"
    thresholds:
      - {from: 2025-06-30, to: 2026-03-31, value: 3.00}
      - {from: 2026-06-30, to: null, value: 2.75, note: "a6; lower minimum = looser"}
    effective_cap:
      2026-06-30: 2.75
    quote: "Permit the Consolidated Interest Coverage Ratio to be less than (i) 3.00:1.00 as of the last day of any Fiscal Quarter ending on or prior to March 31, 2026 (commencing with the Fiscal Quarter ending June 30, 2025), or (ii) 2.75:1.00 as of the last day of any Fiscal Quarter ending on or after June 30, 2026"
    confirmed:
      src: q2
      quote: "a minimum consolidated interest coverage ratio of 2.75 -to-1.00"
    schedule_history:
      - version: ca (2022) - different covenant
        rule: "Consolidated Fixed Charge Coverage Ratio >= 1.20x from Jun 30 2022 until replaced by a5"
        src: ca
        quote: "Permit the Consolidated Fixed Charge Coverage Ratio to be less than 1.20:1.00 as of the last day of any Fiscal Quarter (commencing with the Fiscal Quarter ending June 30, 2022)"
    reported_history:
      - {date: 2025-06-30, ratio: 6.45, floor: 3.00, src: qp, quote: "the Company's consolidated interest coverage ratio was 6.45 -to-1.00 and 11.32 -to-1.00, respectively"}
      - {date: 2025-12-31, ratio: 5.54, floor: 3.00, src: qd, quote: "the Company's consolidated interest coverage ratio was 5.54 -to-1.00 and 11.20 -to-1.00, respectively"}
      - {date: 2026-03-31, ratio: 5.34, floor: 3.00, src: q1, quote: "the Company's consolidated interest coverage ratio was 5.34 -to-1.00 and 5.76 -to-1.00, respectively"}
      - {date: 2026-06-30, ratio: 5.37, floor: 2.75, src: q2, quote: "the Company's consolidated interest coverage ratio was 5.37 -to-1.00 and 5.76 -to-1.00, respectively"}
    replay: not_disclosed

  - id: leverage_cushion_incurrence
    name: NLR cushion test (0.25x inside the current maximum)
    kind: incurrence
    ref: "Permitted Acquisition (b)(ii); 2.10 incrementals; 9.2(m) Specified Incremental Debt; 9.2(o) convertibles"
    src: a6
    current_text_from: a6
    introduced_by: "ca for incrementals; acquisition test as a time-limited proviso in a1_a4 (inferred), extended by a5 to Sep 30 2026, made permanent by a6; 9.2(m) Specified Incremental Debt a1_a4 (inferred, tied to the TLB); converts a6"
    direction: max
    formula: {numerator: consolidated_funded_debt_net, denominator: consolidated_adjusted_ebitda, adjustment: "pro forma for the transaction"}
    threshold_rule: "pro forma NLR <= (9.16(a) cap in effect, incl. any Leverage Step-Up) - 0.25"
    applies_when: [permitted_acquisition, incremental_commitment, specified_incremental_debt (TLB incremental), permitted_convertible_indebtedness]
    cash_netting_note: "for 9.2(m) and 9.2(o) the new debt proceeds may not be netted as Qualifying Cash"
    quotes:
      acquisition: "the Consolidated Net Leverage Ratio (on a pro forma basis) will be at least 0.25 to 1.00 less than the maximum Consolidated Net Leverage Ratio in effect pursuant to Section 9.16(a)"
      incremental: "a Compliance Certificate demonstrating, in form and substance reasonably satisfactory to the Administrative Agent, that the Consolidated Net Leverage Ratio will be at least 0.25 to 1.00 less than the maximum Consolidated Net Leverage Ratio in effect as of the Increased Amount Date pursuant to Section 9.16(a)"
      no_netting: "but without netting proceeds from any such Indebtedness for purposes of determining Qualifying Cash"
      convert_basket: "any Permitted Convertible Indebtedness of Construction Partners in an aggregate principal amount outstanding not to exceed, at any one time, $550,000,000"

  - id: acquisition_liquidity
    name: Permitted Acquisition minimum cash + revolver availability
    kind: incurrence
    ref: "Permitted Acquisition (c)"
    src: a6
    current_text_from: a6
    introduced_by: ca (unchanged)
    direction: min
    value: 20000000
    units: usd
    formula: {expression: "cash + revolving availability, immediately before and after the acquisition"}
    quote: "Borrowers' cash and availability under the Revolving Credit Facility shall be equal to or greater than $20,000,000 immediately prior to and immediately after giving effect to such Acquisition"

  - id: tlb_incurrence_tests
    name: Term Loan B ratio-based incurrence tests (no maintenance covenant)
    kind: incurrence
    ref: "TLB: Incremental (ratio-based amount); 9.2 ratio debt; investments; restricted payments"
    src: tlb
    current_text_from: tlb
    introduced_by: "TLB original; levels loosened by TLB Amendment No. 1"
    direction: max
    tests:
      - {test: "incremental / incremental equivalent debt, pari or junior secured", measure: consolidated_secured_net_leverage, value: 4.00, was: 3.75}
      - {test: "incremental / incremental equivalent debt, unsecured", measure: consolidated_net_leverage, value: 5.00, was: 4.75}
      - {test: "ratio debt, pari or junior secured", measure: consolidated_secured_net_leverage, value: 3.25, was: 3.00}
      - {test: "ratio debt, unsecured", measure: consolidated_net_leverage, value: 4.25, was: 4.00}
      - {test: "general investments basket", measure: consolidated_net_leverage, value: 2.25, was: 2.00}
      - {test: "unlimited restricted payments", measure: consolidated_net_leverage, value: 2.25, was: 2.00}
      - {test: "available-amount restricted payments", measure: consolidated_net_leverage, value: 3.25, was: 3.00}
      - {test: "permitted acquisition", measure: "TLA/RCF 9.16 pro forma (by reference)"}
    note: "`was` values are the struck pre-Amendment No. 1 levels (see blackline_incremental); other was-values read from the redline, not separately quoted"
    quotes:
      incremental: "the Consolidated Secured Net Leverage Ratio calculated on a pro forma basis does not exceed 4.00 to 1.00 or (2) if such Incremental Loans or Incremental Equivalent Debt is unsecured, the Consolidated Net Leverage Ratio calculated on a pro forma basis does not exceed 5.00 to 1.00"
      blackline_incremental: "the Consolidated Secured Net Leverage Ratio calculated on a pro forma basis does not exceed 3.75 4.00 to 1.00 or (2) if such Incremental Loans or Incremental Equivalent Debt is unsecured, the Consolidated Net Leverage Ratio calculated on a pro forma basis does not exceed 4.75 5.00 to 1.00"
      ratio_debt: "the Consolidated Secured Net Leverage Ratio shall not exceed 3.25 to 1.00 after giving pro forma effect to such Indebtedness, or (y) in the event any such Indebtedness is unsecured, the Consolidated Net Leverage Ratio shall not exceed 4.25 to 1.00"
      unlimited_rp: "the Consolidated Net Leverage Ratio calculated on a pro forma basis does not exceed 2.25 to 1.00 and (y) no Default or Event of Default"
      available_amount_rp: "the Consolidated Net Leverage Ratio calculated on a pro forma basis does not exceed 3.25 to 1.00 and (y) no Default or Event of Default"
      investments: "the Consolidated Net Leverage Ratio calculated on a pro forma basis does not exceed 2.25 to 1.00; and (r)"
      acquisition: "the Borrowers shall be in compliance with the requirements of Section 9.16 of the Existing Credit Agreement, on a pro forma basis"

  - id: tlb_cross_acceleration
    name: TLB cross-acceleration to the TLA/RCF financial covenants
    kind: other
    ref: "TLB 10.1(b)(ii)"
    src: tlb
    direction: n/a
    rule: "a TLA/RCF 9.16 breach is a TLB Event of Default only once the Required Revolving Lenders have accelerated the revolver and not rescinded"
    quote: "shall not constitute a Default or Event of Default with respect to any Loans or Commitments hereunder unless and until the Required Revolving Lenders (as defined in the Existing Credit Agreement) have actually declared all Revolving Loans"

# ---------------------------------------------------------------- terms
# type: standard = everyday meaning / GAAP, nothing to map
#       lookup   = points at a list, schedule or another defined term you have to fetch
#       custom   = deal-specific formula; decompose into components
terms:

  - id: consolidated_funded_debt_net
    name: Net debt (numerator of the NLR)
    type: custom
    src: a6
    formula: "consolidated_funded_debt - qualifying_cash"
    measured: "as of the test date"
    quote: "(a) Consolidated Funded Debt, minus Qualifying Cash, as of such date"

  - id: consolidated_funded_debt
    name: Consolidated Funded Debt
    type: custom
    src: a6
    current_text_from: a6
    introduced_by: "ca; Holdback carve-outs a1_a4 (inferred); surety-backed LC carve-out a6"
    scope: "Borrowing Agent and all Subsidiaries, consolidated (minus the captive insurer per 1.3(d)); no restricted/unrestricted split"
    quote: "“Consolidated Funded Debt” means, as at any date of determination, without duplication, the following Indebtedness of the Borrowing Agent and its Subsidiaries, determined on a consolidated basis"
    components:
      - id: cfd.i.a
        what: "borrowed money, bonds, notes, loan agreements (TLA, revolver, TLB, any converts at full principal)"
        sign: +
        input: balance_sheet_debt_schedule
        quote: "(a) all obligations of such Person for borrowed money and all obligations of such Person evidenced by bonds, debentures, notes, loan agreements or other similar instruments"
      - id: cfd.i.b
        what: "letters of credit, bankers' acceptances, bank guaranties at MAXIMUM amount (drawn or not)"
        sign: +
        input: footnotes
        flag: F2
        quote: "(b) the maximum amount of all direct or contingent obligations of such Person arising under letters of credit (including standby and commercial), bankers' acceptances, bank guaranties, surety bonds and similar instruments"
      - id: cfd.i.c
        what: "net obligations under swaps (Swap Termination Value); ROAD's $300M swap is an asset at Jun 30 2026, so nil"
        sign: +
        input: footnotes
        quote: "(c) net obligations of such Person under any Swap Contract"
      - id: cfd.i.d
        what: "deferred purchase price (excluding ordinary trade payables <= 60 days past due, GAAP earn-outs, payroll accruals)"
        sign: +
        input: borrower_schedule
        quote: "(d) all obligations of such Person to pay the deferred purchase price of property or services (other than (i) trade accounts payable in the ordinary course of business and not past due for more than sixty (60) days"
        earnout_exclusion_quote: "(ii) any earn-out or similar obligation to the extent treated as a liability under GAAP"
      - id: cfd.i.excl
        what: "carve-outs from (i): surety bonds, surety-backed LCs and similar (a6), guarantees of them, and the Lone Star Paving Holdback Amount"
        sign: "-"
        input: borrower_schedule
        quote: "(other than (x) surety bonds, surety-backed letters of credit and similar instruments, and Guarantees of the foregoing and (y) any portion of the Holdback Amount constituting Indebtedness)"
        holdback_quote: "“Holdback Amount” has the meaning specified in the Specified LSP Acquisition Agreement as in effect on October 20, 2024"
      - id: cfd.ii
        what: "Attributable Indebtedness (finance/capital leases on frozen pre-ASC 842 GAAP, synthetic leases) other than Holdback"
        sign: +
        input: footnotes
        quote: "(ii) the aggregate outstanding amount of Attributable Indebtedness (other than any portion of the Holdback Amount constituting Attributable Indebtedness)"
      - id: cfd.iii_iv
        what: "purchase money debt; guarantees of others' debt of types (i)-(iii)"
        sign: +
        input: footnotes
        quote: "(iii) all purchase money Indebtedness and (iv) all Guarantees in respect of any Indebtedness of the types described in clause (i), (ii) or (iii) above of any other Person"
      - id: cfd.jv
        what: "debt of general partnerships / non-corporate JVs where a group member is GP or joint venturer, unless non-recourse"
        sign: +
        input: borrower_schedule
        quote: "in which such Person is a general partner or a joint venturer, unless such Indebtedness is expressly made non-recourse to such Person"
    not_included: "Indebtedness clauses (e)-(h) (other people's debt secured on own property, Disqualified Equity, redemption obligations) unless caught by (iii)/(iv)"
    convertibles_rule:
      introduced_by: a6
      quote: "For purposes hereof, the amount of any Permitted Convertible Indebtedness shall be the aggregate stated principal amount thereof"

  - id: qualifying_cash
    name: Qualifying Cash
    type: custom
    src: a6
    current_text_from: a6
    introduced_by: "ca (50% cap); lien carve-out for TLB agent a1_a4 (inferred); a6 cap = greater of $325M and 50% of EBITDA"
    base: "unrestricted cash and Cash Equivalents of Borrowers / domestic Subsidiaries, in U.S. accounts at a qualifying U.S. Fed-member bank, free of liens other than the two agents"
    cap:
      type: greater_of
      fixed: 325000000
      pct_of_ebitda: 0.50
      ebitda_basis: "Consolidated Adjusted EBITDA for the immediately preceding four Fiscal Quarter period"
    input: balance_sheet + account-level detail (location/bank/lien status not in public filings)
    quote: "“Qualifying Cash” means unrestricted cash and Cash Equivalents in an amount up to the greater of (i) $325,000,000 and (ii) fifty percent (50%) of Consolidated Adjusted EBITDA for the immediately preceding four Fiscal Quarter period"
    location_quote: "held by any Borrower or their domestic Subsidiaries in a deposit account or securities account maintained in the United States"
    lien_quote: "not subject to a Lien in favor of any Person other than the Administrative Agent or the Specified LSP Indebtedness Agent"
    prior_cap:
      src: ca
      quote: "unrestricted cash and Cash Equivalents in an amount of up to fifty percent (50%) of Consolidated Adjusted EBITDA for the immediately preceding four Fiscal Quarter period"

  - id: consolidated_adjusted_ebitda
    name: Consolidated Adjusted EBITDA
    type: custom
    src: a6
    current_text_from: a6
    starts_from: consolidated_net_income
    defined_in: "Section 1.1"
    measured: "TTM (four fiscal quarters ending on the test date)"
    scope: "Borrowing Agent and Subsidiaries, consolidated; captive insurer excluded (1.3(d))"
    quote: "“Consolidated Adjusted EBITDA” means, for any period, for the Borrowing Agent and its Subsidiaries on a consolidated basis, an amount equal to Consolidated Net Income for such period plus (a) the following, in each case to the extent deducted (or not included) in calculating such Consolidated Net Income"
    deductions: none   # unlike WEST there is no "minus (b)" clause: non-cash gains are not taken out
    components:
      - {id: ebitda.a.i, category: interest, sign: +, input: income_statement, introduced_by: ca, quote: "(i) Consolidated Interest Charges for such period"}
      - {id: ebitda.a.ii, category: taxes, sign: +, input: income_statement, introduced_by: ca, quote: "(ii) the provision for federal, state, local and foreign income Taxes, paid or payable by the Borrowers and the Subsidiaries for such period"}
      - {id: ebitda.a.iii, category: depreciation_amortization, sign: +, input: cash_flow_statement, introduced_by: ca, note: "text says depreciation and amortization; whether depletion and accretion (in ROAD's DD&A line) count is a reading call", quote: "(iii) depreciation and amortization expense"}
      - {id: ebitda.a.iv, category: non_cash_equity_comp, sign: +, input: cash_flow_statement, introduced_by: ca, quote: "(iv) non-cash equity based compensation expense for such period"}
      - {id: ebitda.a.v, category: sponsor_management_fees, sign: +, input: borrower_schedule, introduced_by: ca, quote: "(v) management fees and expenses paid to SunTx Capital Management Corp. pursuant to the Management Services Agreement for such period"}
      - {id: ebitda.a.vi, category: financing_fees_this_facility_and_tlb, sign: +, input: borrower_schedule, introduced_by: a5, quote: "(vi) non-recurring transaction fees, costs and expenses paid in connection with this Agreement, the other Loan Documents, Specified LSP Indebtedness and any Specified LSP Refinancing Indebtedness"}
      - id: ebitda.a.vii
        category: transaction_costs_and_earnouts
        sign: +
        input: borrower_schedule
        introduced_by: a5
        review: human_signoff
        trigger: "fees paid within 12 months of closing/abandonment of an equity issuance, restructuring, Permitted Acquisition or Investment (consummated or not); plus earn-out expense paid in the period"
        cap:
          type: pct_of_ebitda
          value: 0.15
          basis: "Consolidated Adjusted EBITDA BEFORE the (vii) add-backs, for the last delivered Test Period (not circular, unlike WEST)"
        reporting: "itemised schedule with each Compliance Certificate"
        quote: "(vii) all non-recurring transaction fees, charges and other amounts (including any financing fees, merger and acquisition fees, legal fees and expenses, due diligence fees or any other fees and expenses in connection therewith) in connection with any equity issuances"
        cap_quote: "any amounts described in this clause (a)(vii) shall not exceed 15% of Consolidated Adjusted EBITDA (calculated prior to giving effect to all addbacks pursuant to this clause (vii))"
      - id: ebitda.a.viii
        category: lsp_acquisition_costs
        sign: +
        input: borrower_schedule
        introduced_by: a5
        cap: {type: time_window, rule: "paid within 12 months of Oct 30 2024, i.e. by Oct 30 2025; no dollar cap"}
        status_2026_06_30: "window closed Oct 30 2025; a TTM to Jun 30 2026 can still include amounts paid Jul 1 - Oct 30 2025"
        quote: "(viii) all non-recurring transaction fees, charges and other amounts paid in connection with the Specified LSP Acquisition, to the extent paid within twelve (12) months of the Fourth Amendment Effective Date"
      - id: ebitda.a.ix
        category: acquired_employee_costs
        sign: +
        input: borrower_schedule
        introduced_by: ca
        trigger: "comp/benefits of acquired-company staff terminated, re-hired at lower pay, or not hired, ending within 60 days of the acquisition"
        quote: "(ix) compensation expense and benefit expense for any employees or management of an entity acquired in a Permitted Acquisition"
        trigger_quote: "such compensation expense or benefit expense terminates within sixty (60) days after the date of such Permitted Acquisition"
      - id: ebitda.a.x
        category: agent_approved_non_recurring
        sign: +
        input: agent_approval
        introduced_by: ca
        review: human_signoff
        cap: none
        quote: "(x) other non-recurring costs and expenses approved by Administrative Agent, in its sole discretion"
      - id: ebitda.a.xi
        category: liquid_asphalt_terminal_run_rate
        sign: +
        input: borrower_projection
        introduced_by: ca
        review: human_signoff
        trigger: "terminal completed and Specified Liquid Asphalt Terminal Certification delivered; first counted in the TTM ending with the completion quarter, pro forma for the full TTM"
        decay: "reduced by 25% of the original amount each subsequent Test Period (gone after four further quarters)"
        cap:
          type: lesser_of
          pct_of_ebitda: 0.10
          fixed: 7500000
          basis: "Consolidated Adjusted EBITDA before the terminal add-back; aggregate across all terminals"
        approval: "Administrative Agent review and approval; certified projections; factually supportable, realizable within 12 months"
        quote: "(xi) with respect to each Completed Specified Liquid Asphalt Terminal, the Specified Liquid Asphalt Terminal Increase"
        cap_quote: "shall not exceed the lesser of (a) 10% of Consolidated Adjusted EBITDA (before giving effect to such inclusion) or (b) $7,500,000"
        decay_quote: "shall be reduced by 25% of the original amount for each subsequent Test Period (i.e., at the end of each subsequent Fiscal Quarter)"
        approval_quote: "the amount of any Specified Liquid Asphalt Terminal Increase shall be subject to the Administrative Agent's review and approval"
        amount_quote: "an amount equal to the “run rate” pro forma projected Consolidated Adjusted EBITDA of such liquid asphalt terminal for the four-Fiscal Quarter period commencing with the Fiscal Quarter that includes the Specified Liquid Asphalt Terminal Completion Date"
      # provisos and adjustments ----------------------------------------
      - id: ebitda.pro_forma_acquisitions
        category: acquired_or_disposed_ebitda
        sign: "+/-"
        input: borrower_schedule
        trigger: "Specified Acquisition / Specified Disposition (target EBITDA >= $500K) during the TTM; see agreement.calculation_rules.pro_forma"
        quote: "For the avoidance of doubt, Consolidated Net Income shall be calculated, including pro forma adjustments, in accordance with Section 1.5."
      - id: ebitda.equity_cure
        category: equity_cure
        sign: +
        input: agent_notice
        trigger: "Cure Amount under 10.3; 9.16 only"
        quote: "The Cure Amount shall be added to Consolidated Adjusted EBITDA for the applicable Fiscal Quarter and included in any test period that includes such Fiscal Quarter."

  - id: consolidated_net_income
    name: Consolidated Net Income
    type: custom
    src: a6
    current_text_from: a6
    introduced_by: ca (unchanged by a5/a6)
    starts_from: "GAAP net income of Borrowing Agent + Subsidiaries"
    quote: "the net income of the Borrowing Agent and its Subsidiaries (excluding extraordinary gains and extraordinary losses) for that period in accordance with GAAP"
    exclusions:
      - {id: cni.extraordinary, what: "extraordinary gains and losses (a GAAP category that no longer exists post ASU 2015-01; reading call)", quote: "(excluding extraordinary gains and extraordinary losses)"}
      - {id: cni.a.i, what: "income/loss of non-Subsidiaries (e.g. ROAD's joint venture) except cash actually distributed", quote: "(i) any income (or loss) for such period for any Person that is not a Subsidiary except to the extent of the aggregate amount of such net income actually distributed in cash"}
      - {id: cni.a.ii, what: "positive net income of a Subsidiary that cannot dividend it up", quote: "(ii) the net income (if positive) of any Subsidiary to the extent that the declaration or payment of dividends or similar distributions by such Subsidiary"}
    inclusions:
      - {id: cni.b, what: "cash distributions from non-Subsidiary investments not otherwise in net income", quote: "(b) Consolidated Net Income shall include any cash distributions received from or on account of an Investment in a Person that is not a Subsidiary"}
    not_excluded_note: "no exclusions for non-cash gains/losses, impairments, debt extinguishment, hedging MTM or asset-sale gains (contrast WEST cni.a-p). Gain on sale of PP&E stays in."

  - id: consolidated_interest_charges
    name: Consolidated Interest Charges
    type: custom
    src: a6
    current_text_from: a6
    introduced_by: ca (unchanged)
    gross_or_net: gross   # no netting of interest income
    quote: "the sum of all interest, premium payments, if any, debt discount, if any, fees, charges and related expenses of the Borrowing Agent and its Subsidiaries in connection with Consolidated Funded Debt (including capitalized interest) or in connection with the deferred purchase price of assets, in each case to the extent treated as interest in accordance with GAAP"
    components:
      - {id: cic.interest, what: "interest on Consolidated Funded Debt incl. capitalized interest", sign: +, input: footnotes}
      - {id: cic.premium_discount, what: "premium payments and debt discount (OID) amortization", sign: +, input: footnotes}
      - {id: cic.fees, what: "fees, charges and related expenses treated as interest under GAAP (likely incl. deferred financing cost amortization and LC/commitment fees if booked to interest)", sign: +, input: footnotes, inferred: true}
      - {id: cic.deferred_purchase, what: "interest on deferred purchase price of assets", sign: +, input: footnotes}
    swap_note: "no explicit hedge netting; realized swap gains booked in GAAP interest expense would reduce it only if 'treated as interest' (reading call)"

  - id: indebtedness
    name: Indebtedness
    type: lookup
    src: a6
    kind: list
    items: [a borrowed money and notes, b LCs / BAs / guaranties / surety bonds (maximum amount), c net swap obligations, d deferred purchase price, e debt secured on own property, f Attributable Indebtedness, g Disqualified Equity Interests, h equity redemption obligations, i guarantees]
    used_by_cfd: [a, b, c, d]
    warrant_carve_out:
      introduced_by: a6
      quote: "the obligations of Construction Partners under any Permitted Warrant Transaction shall not constitute Indebtedness"
    quote: "“Indebtedness” means, as to any Person at a particular time, without duplication, all of the following, whether or not included as indebtedness or liabilities in accordance with GAAP"

  - id: attributable_indebtedness
    name: Attributable Indebtedness
    type: lookup
    src: a6
    points_to: capitalized_leases_frozen_gaap
    quote: "(a) in respect of any Capitalized Lease of any Person, the capitalized amount thereof that would appear on a balance sheet of such Person prepared as of such date in accordance with GAAP"

  - id: captive_insurance_company
    name: Captive Insurance Company (excluded entity)
    type: lookup
    src: a6
    points_to: "Construction Partners Risk Management, Inc. (CP Risk) while it meets the definition's conditions"
    quote: "“Captive Insurance Company” means Construction Partners Risk Management, Inc., a corporation organized under the laws of the State of Alabama (“CP Risk”)"

  - id: specified_lsp_indebtedness
    name: Specified LSP Indebtedness (= the Term Loan B)
    type: lookup
    src: a6
    points_to: term_loan_b
    note: "included in Consolidated Funded Debt as borrowed money; pari passu secured"
    quote: "“Specified LSP Indebtedness” means Indebtedness incurred on the Fourth Amendment Effective Date consisting of a senior secured term B loan credit facility"

  # standard terms: everyday / GAAP meaning, nothing to decompose
  - {id: gaap, name: GAAP, type: standard, note: "frozen for leases (1.3(c)); change-in-GAAP renegotiation clause 1.3(b)"}
  - {id: subsidiary, name: Subsidiary, type: standard, note: "no unrestricted-subsidiary concept found in the TLA/RCF; all subsidiaries count except the captive insurer"}
  - {id: cash_equivalents, name: Cash Equivalents, type: standard, note: "defined list (Treasuries, CDs at $500M+ banks, money market funds)"}
  - {id: test_period, name: Test Period, type: standard, note: "see agreement.test_period"}

# ---------------------------------------------------------------- lookups
lookups:
  - id: compliance_certificate_form
    name: Exhibit H Compliance Certificate
    status: missing
    why: "exhibits are not filed with the amendment"
  - id: holdback_amount
    name: Holdback Amount under the LSP Unit Purchase Agreement (Oct 20 2024)
    status: missing
    why: "amount not disclosed in the 10-Q; needed to apply the carve-out"
  - id: qualifying_cash_accounts
    name: Account-level cash (location, bank, lien status)
    status: missing
    why: "10-Q gives only consolidated cash; Qualifying Cash needs domestic, qualifying-bank, unencumbered balances"
  - id: specified_liquid_asphalt_terminals
    name: Terminal certifications and approved run-rate amounts
    status: missing
  - id: missing_amendments
    name: Amendments 1-4 and the Nov 17 2022 Consent
    status: missing
    why: "not in the folder; their effect on covenant text is visible only as a5 base (struck) text"

# ---------------------------------------------------------------- replay test
replay:
  # The 10-Q (quarter ended Jun 30 2026) discloses only the reported ratios, not the
  # covenant EBITDA, Funded Debt build or Qualifying Cash. Both entries are therefore
