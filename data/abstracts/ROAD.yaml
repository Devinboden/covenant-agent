# ---------------------------------------------------------------- agreement
agreement:
  name: Third Amended and Restated Credit Agreement (Term Loan A / Revolver)
  src: a6
  borrowing_agent: Construction Partners, Inc.
  borrowers: "Construction Partners, Inc. and wholly owned operating subsidiaries as co-borrowers (13 named in a6)"
  agent: PNC Bank, National Association
  quote: "among Construction Partners, Inc., a Delaware corporation (“Construction Partners” or “Borrowing Agent”)"
  agent_quote: "and PNC Bank, National Association (“Administrative Agent”), as Administrative Agent and Issuing Lender"
  facilities: "Revolver $700M (after a6 $200M incremental), Term Loan A $600M original (a5); both mature Jun 28 2030"
  facilities_quotes:
    src: q2
    revolver_quote: "increased the revolving credit facility thereunder from $500.0 million to $700.0 million"
    maturity_quote: "All outstanding advances under the Term Loan A and Revolving Credit Facility are due and payable in full on June 28, 2030"
  expiration_quote: "“Expiration Date” means, with respect to the Revolving Credit Commitments, June 28, 2030"
  closing_date:
    value: 2022-06-30
    inferred: "agreement is 'dated as of' Jun 30 2022; 'Closing Date' is defined as the day Section 7.1 conditions were first satisfied, actual date not stated in the filed text"
    src: ca
    quote: "Dated as of June 30, 2022"
    definition_quote: "“Closing Date” means the Business Day on which the conditions specified in Section 7.1 shall be first satisfied"
  fiscal_year_end: 09-30
  fiscal_year_quote: "“Fiscal Year” means the fiscal year of the Borrowing Agent and its Subsidiaries ending on September 30 of each year"
  fiscal_quarter_quote: "“Fiscal Quarter” means a fiscal quarter ending on March 31, June 30, September 30 or December 31 of each Fiscal Year"

  current_text_method:
    conformed_copy_available: "blackline only (a5 and a6 each attach Exhibit A, marked to show changes)"
    approach: "a6 Exhibit A with struck runs removed = current text; a5 struck runs = text after Amendments 1-4; ca = 2022 original"
    confidence: high for 9.16 and the definitions used by it (three-way cross-check against ca, a5 base text and the 10-Q schedule description); medium for anything only in a6 where struck/inserted runs are interleaved inside numbers
    conformed_quote: "as set forth in the conformed copy of the Credit Agreement attached hereto as Exhibit A hereto"
    exhibit_quote: "EXHIBIT A Conformed Copy of the Credit Agreement [See attached.]"
    a5_exhibit:
      src: a5
      quote: "EXHIBIT A Conformed Copy of the Credit Agreement [See attached.]"
    blackline_markup_quote: "to delete red or green stricken text (indicated textually in the same manner as the following examples: stricken text and stricken text) and (ii) to add the blue or green double-underlined text"

  amendments:
    # all listed in the a6 recital; only 5 and 6 are in the folder
    - {no: 1, date: 2022-11-17, in_folder: false, covenant_change: unknown, quote: "(i) First Amendment to Third Amended and Restated Credit Agreement, dated as of November 17, 2022, (ii) Consent, dated as of November 17, 2022"}
    - {no: 2, date: 2023-05-08, in_folder: false, covenant_change: unknown, quote: "(iii) Second Amendment to Third Amended and Restated Credit Agreement, dated as of May 8, 2023"}
    - {no: 3, date: 2024-05-29, in_folder: false, covenant_change: unknown, quote: "(iv) Third Amendment to Third Amended and Restated Credit Agreement and First Amendment to Third Amended and Restated Security Agreement, dated as of May 29, 2024"}
    - no: 4
      date: 2024-10-30
      in_folder: false
      covenant_change: "yes (inferred): between ca and a5's base text the flat 3.50x NLR became a step schedule (4.50x peak), Holdback Amount carve-outs were added to Consolidated Funded Debt, Qualifying Cash allowed liens of the TLB agent, and a time-limited 0.25x acquisition cushion test was added. The 4th Amendment accompanied the Lone Star Paving acquisition and TLB, so it is the likely source; 1-3 cannot be excluded"
      quote: "(vi) Fourth Amendment to Third Amended and Restated Credit Agreement, dated as of October 30, 2024"
      effective_quote: "“Fourth Amendment Effective Date” means the first date all the conditions precedent to effectiveness in the Fourth Amendment are satisfied or waived which was October 30, 2024"
    - no: 5
      date: 2025-06-30
      in_folder: true
      note: "FCCR 1.20x replaced by ICR 3.00x; NLR schedule reset (4.50x to Dec-25, 4.25x, 4.00x, 3.75x from Sep-27); step-up start moved to Sep-27; EBITDA add-backs (vi)-(viii) incl. 15% cap; revolver $500M, TLA $600M, maturity Jun 28 2030"
      quote: "(x) Fifth Amendment to Third Amended and Restated Credit Agreement, dated as of June 30, 2025"
      description:
        src: qp
        quote: "replaced the consolidated fixed charge coverage ratio covenant with a consolidated interest coverage ratio covenant, (iii) adjusted the maximum consolidated net leverage ratio permitted thereunder"
    - no: 6
      date: 2026-06-03
      in_folder: true
      note: "NLR relief (4.75x Jun-26..Sep-26, 4.50x, 4.25x, 4.00x from Jun-28); ICR to 2.75x from Jun-26; step-up 4.25x from Jun-28; Qualifying Cash cap now greater of $325M / 50% EBITDA; surety-backed LCs out of Funded Debt; Material Acquisition $100M; 0.25x cushion incurrence tests; convertible notes basket; revolver +$200M"
      quote: "dated as of June 3, 2026"
      description:
        src: q2
        quote: "On June 3, 2026, the parties entered into an amendment to the Term Loan A / Revolver Credit Agreement that, among other things, (i) increased the revolving credit facility thereunder from $500.0 million to $700.0 million (the “Revolving Credit Facility”) and (ii) adjusted certain financial covenants"
      effective_date: unknown   # "Sixth Amendment Effective Date" = date conditions satisfied; not stated in the filing
      effective_date_quote: "(the date of such satisfaction being the “Sixth Amendment Effective Date”)"
      condition_quote: "that the Consolidated Net Leverage Ratio does not exceed 0.25 to 1.00 less than the maximum Consolidated Net Leverage Ratio in effect pursuant to Section 9.16(a)"

  reporting:
    annual_financials:
      due: "120 days after fiscal year end (Sep 30 -> ~Jan 28)"
      ref: "8.1(a)"
      quote: "within one hundred twenty (120) days after the end of each Fiscal Year"
    quarterly_financials:
      due: "45 days after fiscal Q1, Q2, Q3 (Dec 31, Mar 31, Jun 30)"
      ref: "8.1(b)"
      quote: "within forty-five (45) days after the end of each of the first three Fiscal Quarters of each Fiscal Year"
    compliance_certificate:
      due: "concurrently with each 8.1(a)/(b) delivery; so the Sep 30 test is certified at 120 days, the others at 45 days"
      ref: "8.2(a)"
      quote: "concurrently with the delivery of the financial statements referred to in Sections 8.1(a) and (b), a duly completed Compliance Certificate signed by a Responsible Officer of the Borrowing Agent"
      form: "Exhibit H (not filed publicly)"
      form_quote: "“Compliance Certificate” means a certificate substantially in the form of Exhibit H"
      addback_schedule_quote: "Borrowing Agent shall provide with each applicable Compliance Certificate a schedule in reasonable detail describing all such items in this clause (vii)"
    annual_projections:
      due: "60 days after fiscal year end"
      ref: "8.1(c)"
      quote: "no later than sixty (60) days after the end of each Fiscal Year, an annual projection, budget and forecast"

  test_period:
    meaning: "covenants are tested on each fiscal quarter end, using the four fiscal quarters ending on that date (TTM) for EBITDA and interest; debt and cash as of that date"
    nlr_quote: "Consolidated Adjusted EBITDA for the period of the four (4) prior Fiscal Quarters ending on or most recently prior to such date"
    defined_term_quote: "“Test Period” means, for any date of determination under this Agreement, the four consecutive Fiscal Quarters of the Borrowers most recently ended as of such date of determination for which financial statements have been delivered (or are required to be delivered) pursuant to Section 8.1(a) or (b), as applicable"
    note: "the 9.16 ratios use their own 'four (4) prior Fiscal Quarters' wording; 'Test Period' (delivered statements) drives the (a)(vii) cap, Specified Acquisition size and the step-up pro forma test"

  calculation_rules:
    rounding:
      ref: "1.6"
      rule: "compute to one more decimal than the covenant (3 places for x.xx), then round half up"
      quote: "carrying the result to one place more than the number of places by which such ratio is expressed herein and rounding the result up or down to the nearest number (with a rounding-up if there is no nearest number)"
    face_value:
      ref: "1.8"
      quote: "all calculations shall be made based on the face value of the relevant Obligation and not at any discounted value"
    frozen_gaap_leases:
      ref: "1.3(c)"
      rule: "operating leases (pre-ASC 842) are not Capitalized Leases, so they stay out of Attributable Indebtedness"
      quote: "shall not be accounted for as Capitalized Leases for purposes of this Agreement regardless of any change in GAAP"
    captive_insurance_excluded:
      ref: "1.3(d)"
      rule: "CP Risk Management (captive insurer) is carved out of every ratio"
      quote: "the Captive Insurance Company shall be excluded from the calculation of any financial ratio (including the Consolidated Interest Coverage Ratio and the Consolidated Net Leverage Ratio)"
      introduced_by: ca (text updated by a5 to name ICR)
    convertible_valuation:
      ref: "1.3(a), Indebtedness"
      introduced_by: a6
      quote: "Permitted Convertible Indebtedness shall at all times prior to the repurchase, conversion (or exchange, as the case may be) or payment thereof be valued at the full stated principal amount thereof"
    pro_forma:
      ref: "1.5"
      rule: "EBITDA pro forma for Specified Acquisitions/Dispositions (target EBITDA >= $500K) as of day one of the period; when EBITDA is pro forma'd, the other ratio components are too"
      quote: "Consolidated Adjusted EBITDA will be calculated after giving pro forma effect to any Specified Dispositions or Specified Acquisitions occurring during the relevant period, as if such Dispositions or Acquisitions occurred on the first day of such period"
      other_components_quote: "the other elements of the Consolidated Interest Coverage Ratio and Consolidated Net Leverage Ratio will also be calculated after giving pro forma effect to such Acquisition or Disposition"
      size_quote: "has a Consolidated Adjusted EBITDA of at least $500,000 during the Test Period most recently ended on or prior to the date of such Acquisition"

  elections:
    leverage_step_up:
      what: "Borrowing Agent may raise the NLR cap to 4.25x for the quarter of a Material Acquisition (or any of the next three) and the three following quarters, but only for quarters ending Jun 30 2028 and later"
      ref: "9.16(a) proviso"
      introduced_by: "ca (4.00x, any quarter); a5 moved availability to Sep 30 2027+; a6 moved it to Jun 30 2028+ and raised it to 4.25x"
      available_from: 2028-06-30
      value: 4.25
      duration: "the election quarter + 3 following fiscal quarters"
      conditions:
        - "a Material Acquisition consummated in the current or any of the three preceding fiscal quarters"
        - "notice + pro forma Compliance Certificate at least 5 Business Days before closing the acquisition"
      limit: "none stated in the text (no cap on count, no cool-off period)"
      used: unknown
      quote: "provided that, for the fiscal quarter ending June 30, 202 8 and each fiscal quarter thereafter, at the Borrowing Agent's election, following a Material Acquisition"
      value_quote: "the maximum permitted Consolidated Net Leverage Ratio shall be increased to 4. 25:1.00 (such increase, a “Leverage Step-Up”) for such Fiscal Quarter and the immediately following three Fiscal Quarters"
      notice_quote: "at least five Business Days (or such shorter period as may be agreed to by the Administrative Agent) prior to the consummation of such Material Acquisition"
      material_acquisition:
        rule: "Post-Closing Permitted Acquisitions in the current + prior 3 fiscal quarters with aggregate consideration (excluding earnouts) >= $100M (was $75M before a6)"
        quote: "have an aggregate consideration (excluding any earnouts) of at least $100,000,000"
        post_closing_quote: "“Post-Closing Permitted Acquisition” means a Permitted Acquisition that is consummated after the Fifth Amendment Effective Date"

  equity_cure:
    ref: "10.3"
    introduced_by: ca
    effect: "net cash proceeds of common equity designated as Cure Amount increase Consolidated Adjusted EBITDA for the quarter and every test period that includes it; 9.16 only"
    quote: "designate any portion of the net cash proceeds from a sale or issuance of Equity Interests constituting common stock or any cash contribution to the common capital of Construction Partners (the “Cure Amount”) as a dollar-for-dollar increase to Consolidated Adjusted EBITDA for the applicable Fiscal Quarter"
    deadline: "received after quarter end and by the 10th Business Day after financial statements are due (Cure Expiration Date); irrevocable Notice of Intent to Cure in that window"
    deadline_quote: "on or prior to the tenth (10 th) Business Day after the date on which financial statements are required to be delivered with respect to such applicable Fiscal Quarter (the “Cure Expiration Date”)"
    mandatory_prepayment_quote: "the Borrowers shall prepay the Loans with such net cash proceeds pursuant to Section 5.3 on or prior to the Cure Expiration Date"
    limits:
      - rule: "two cure-free quarters in every four"
        quote: "In each period of four consecutive Fiscal Quarters, there shall be at least two Fiscal Quarters in which no cure right set forth in this Section 10.3 is exercised"
      - rule: "max one cure per fiscal year"
        quote: "in each Fiscal Year, there shall not be more than one (1) cure right exercised pursuant to this Section 10.3"
      - rule: "max three cure quarters over the life of the facilities"
        quote: "There can be no more than three Fiscal Quarters in which the cure rights set forth in this Section 10.3 are exercised during the term of the Obligations hereunder"
      - rule: "no more than needed to cure"
        quote: "do not exceed the aggregate amount necessary to cure any Event of Default resulting from the failure to comply with Section 9.16 as of such date"
      - rule: "no pro forma debt reduction / cash netting from the cure in the cured quarter"
        quote: "there shall be no pro forma reduction in Indebtedness (through either netting of cash or the prepayment of the Loans) or related Consolidated Interest Charges or principal payments of Funded Debt with the Cure Amount"
    cures_used: unknown

  term_loan_b:
    src: tlb
    what: "separate Term Loan Credit Agreement (Bank of America, agent), $850M funded Nov 1 2024 for Lone Star Paving; refinanced + $300M incremental by Amendment No. 1 (Jun 18 2026); matures Nov 1 2031; pari passu first-lien with TLA/RCF"
    quote: "AMENDMENT NO. 1 TO TERM LOAN CREDIT AGREEMENT, dated as of June 18, 2026"
    original_quote: "that certain Term Loan Credit Agreement, dated as of November 1, 2024"
    maintenance_covenant: none     # VERIFIED: README said "assumed not, unverified"
    evidence:
      - what: "Section 9.16 (the slot where the TLA/RCF agreement puts its financial covenants) is reserved, unmarked in the Amendment No. 1 blackline, so reserved before and after"
        quote: "9.16 [Reserved]. 9.17 ERISA."
      - what: "TLB Event of Default for a TLA/RCF 9.16 breach only after the revolving lenders actually accelerate (cross-acceleration, not cross-default)"
        quote: "fails to comply with the financial covenants set forth in Section 9.16 of the Existing Credit Agreement"
        proviso_quote: "shall not constitute a Default or Event of Default with respect to any Loans or Commitments hereunder unless and until the Required Revolving Lenders (as defined in the Existing Credit Agreement) have actually declared all Revolving Loans"
      - what: "TLB borrows the TLA/RCF covenant by reference: 'Existing Credit Agreement' floats with future TLA/RCF amendments"
        quote: "as the same may be further amended, restated, supplemented, increased or otherwise modified from time to time (including any amendment and restatement thereof)"
    pricing_ratio: "Consolidated First Lien Net Leverage Ratio, 2.95x grid (pricing only, from Sep 30 2026)"
    pricing_quote: "“Consolidated First Lien Net Leverage Ratio” means, as of any date of determination, the ratio of (a) Consolidated First Lien Debt, minus Qualifying Cash, as of such date to (b) Consolidated Adjusted EBITDA"

# ---------------------------------------------------------------- covenants
covenants:

  - id: net_leverage
    name: Consolidated Net Leverage Ratio
    kind: ratio
    ref: "9.16(a)"
    src: a6
    current_text_from: a6
    introduced_by: "ca (flat 3.50x); schedule by a1_a4 (inferred, likely 4th); reset by a5; current schedule by a6"
    direction: max
    tested: "quarterly, last day of each fiscal quarter (from FQ ending Jun 30 2025 under the current text)"
    formula: {numerator: consolidated_funded_debt_net, denominator: consolidated_adjusted_ebitda}
    expression: "(consolidated_funded_debt - qualifying_cash) / consolidated_adjusted_ebitda (TTM)"
    definition_quote: "“Consolidated Net Leverage Ratio” means, as of any date of determination, the ratio of (a) Consolidated Funded Debt, minus Qualifying Cash, as of such date to (b) Consolidated Adjusted EBITDA for the period of the four (4) prior Fiscal Quarters ending on or most recently prior to such date"
    row_dates: "from/to are fiscal quarter-end test dates (inclusive)"
    thresholds:
      - {from: 2025-06-30, to: 2025-12-31, value: 4.50, note: "each FQ ending on or before Dec 31 2025 (a5 text, unchanged by a6)"}
      - {from: 2026-03-31, to: 2026-03-31, value: 4.25, note: "single quarter row; a6 split it out of the a5 Mar-26..Sep-26 4.25x row"}
      - {from: 2026-06-30, to: 2026-09-30, value: 4.75, note: "a6 relief (was 4.25x)"}
      - {from: 2026-12-31, to: 2027-06-30, value: 4.50, note: "a6 (was 4.00x)"}
      - {from: 2027-09-30, to: 2028-03-31, value: 4.25, note: "a6 (was 3.75x thereafter)"}
      - {from: 2028-06-30, to: null, value: 4.00, note: "a6 new final step"}
      # election overlay (ignored by the schedule check): Leverage Step-Up, see agreement.elections
      - {from: 2028-06-30, to: null, value: 4.25, regime: step_up, note: "only if elected after a Material Acquisition; election quarter + 3 following"}
    regime_rule: "standard schedule by test date; from Jun 30 2028 the cap is 4.25x for four quarters if a Leverage Step-Up is elected"
    effective_cap:
      2026-03-31: 4.25
      2026-06-30: 4.75
      2026-09-30: 4.75
      2026-12-31: 4.50
    quotes:
      covenant: "Permit the Consolidated Net Leverage Ratio to exceed, as of the last day of any Fiscal Quarter (commencing with the Fiscal Quarter ending June 30, 2025), the corresponding ratio set forth below for such fiscal quarter"
      table: "Each fiscal quarter ending on or prior to December 31, 2025 4.50 to 1.00 Fiscal quarter ending March 31, 2026 4.25 to 1.00 Each fiscal quarter ending June 3 0, 2026 and through and including September 30, 2026 4. 7 5 to 1.00 Each fiscal quarter ending December 31, 2026 and through and including June 30, 2027 4. 5 0 to 1.00 Each fiscal quarter ending September 30, 2027 and through and including March 31, 2028 4. 2 5 to 1.00 Each fiscal quarter ending June 30, 2028 and thereafter 4.00 to 1.00"
      schedule_confirmed:
        src: q2
        quote: "a maximum consolidated net leverage ratio determined as follows: (i) for each fiscal quarter ending June 30, 2026 through and including September 30, 2026, 4.75 -to-1.00; (ii) for each fiscal quarter ending December 31, 2026 through and including June 30, 2027, 4.50 -to-1.00; (iii) for each fiscal quarter ending September 30, 2027 through and including March 31, 2028, 4.25 -to-1.00; and (iv) for each fiscal quarter ending June 30, 2028 and thereafter, 4.00 -to-1.00, subject to certain adjustments"
    reading: "<= Dec 31 2025: 4.50 | Mar 31 2026: 4.25 | Jun 30 2026 - Sep 30 2026: 4.75 | Dec 31 2026 - Jun 30 2027: 4.50 | Sep 30 2027 - Mar 31 2028: 4.25 | Jun 30 2028 and thereafter: 4.00 (live text splits digits per character)"
    schedule_history:   # superseded schedules; kept for back-testing older quarters
      - version: ca (2022)
        rule: "3.50x every quarter from Jun 30 2022; step-up to 4.00x after a Material Acquisition (no start date)"
        src: ca
        quote: "Permit the Consolidated Net Leverage Ratio to exceed 3.50:1.00 as of the last day of any Fiscal Quarter (commencing with the Fiscal Quarter ending June 30, 2022)"
        step_up_quote: "the maximum permitted Consolidated Net Leverage Ratio shall be increased to 4.00:1.00 (such increase, a “Leverage Step-Up”)"
      - version: a1_a4 (struck in a5)
        inferred: "read from a5's struck runs; the amending document is not in the folder"
        rule: "<= Sep 30 2024: 3.50 | Dec 31 2024 - Sep 30 2025: 4.50 | Dec 31 2025 - Sep 30 2026: 4.00 | Dec 31 2026+: 3.50; step-up 4.00x from Dec 31 2026"
        src: a5
        blackline_quote: "Each fiscal quarter ending on or prior to S D e pt c ember 3 0 1, 202 4 5 3 4.50 to 1.00 Each fiscal quarter ending December March 31, 202 4 6 and through and including September 30, 202 5 6 4. 2 5 0 to 1.00"
      - version: a5 (Jun 30 2025 - Jun 3 2026)
        rule: "<= Dec 31 2025: 4.50 | Mar 31 2026 - Sep 30 2026: 4.25 | Dec 31 2026 - Jun 30 2027: 4.00 | Sep 30 2027+: 3.75; step-up 4.00x from Sep 30 2027"
