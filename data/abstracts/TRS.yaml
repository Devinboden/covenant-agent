# TriMas covenant abstract (agent-built draft, public filings only)
# Every quote is checked verbatim against its source by engine/verify_abstract.py.
# Amounts in the replay are USD thousands. Ratios are x:1.00.
#
# SOURCE CAVEAT: the "conformed" Tenth Amendment exhibit is a BLACKLINE. The checker strips
# HTML, so struck-through (deleted) text and double-underlined (inserted) text both appear
# inline in the normalized `ca` text (e.g. "in excess of $5,000,000 25,000,000"). Quotes were
# chosen to avoid changed spans except where the change itself is the point (flag F1).
# Changed spans were identified by reading the HTML styles (red line-through = deleted,
# blue underline = inserted); that mapping is recorded under agreement.blackline_changes.

schema_version: 0.1
abstract_id: TRS-2026-06-30
status: draft            # draft -> verified (code checks pass) -> signed_off (human)
as_of: 2026-06-30        # text current through the Tenth Amendment (Mar 20 2026); Mar 4 2026 Consent not on file
built_by: agent (Claude, Opus) for Devin, 2026-10-10

sources:
  ca:
    file: data/filings/TRS/amendment_10th-amendment-2026-03-conformed.htm
    what: Tenth Amendment (Mar 20 2026) with the amended Credit Agreement attached as a blackline (Exhibit A). Main current-agreement text.
  a9:
    file: data/filings/TRS/amendment_9th-amendment.htm
    what: Ninth Amendment (Dec 29 2025) - Aerospace discontinued-ops carve-out in Consolidated Net Income
  q2:
    file: data/filings/TRS/10-Q_2026-06-30.htm
