    quote: "“Consolidated Net Income” means, for any period, the net income or loss of Holdings, the Parent Borrower and the Subsidiaries (including the Receivables Subsidiary) for such period, determined on a consolidated basis in accordance with GAAP; provided that there shall be excluded"
    exclusions:
      - {id: cni.a, what: "income of non-wholly-owned persons except cash distributions", quote: "(a) the income of any Person (other than the Parent Borrower or a Significant Investment) in which any other Person"}
