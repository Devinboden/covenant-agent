# ---------------------------------------------------------------- judgment flags
flags:
  - id: F1
    topic: Blackline source text
    issue: "The only current-agreement text on file is a blackline. Normalized text interleaves deleted and inserted words (e.g. swap threshold '$5,000,000 25,000,000'; '(ii iii)'). Any extractor reading plain text will mis-read these spots. The deleted/inserted mapping here came from HTML styles."
    impact: "swap threshold: at $5M the $15.0M swap liability would count (variant V6, see checker output); at $25M it does not"
    owner: setup_agent (source parsing) + human sign-off
  - id: F2
    topic: Cash netting is the whole covenant story
    issue: "Cash of $1.24B vs gross debt of ~$401M. Netting is floored at $10M and capped at $240M for 6.13. Gross leverage would breach 4.00x; uncapped netting gives a negative ratio."
    impact: "see variants V2/V3 in checker output"
    owner: credit_officer
  - id: F3
    topic: Two netting caps, one defined term
    issue: "The $240M cap applies 'solely with respect to the financial covenants set forth in Section 6.13'. Incurrence gates that test TNLR (RP grid 6.08(a)(viii), 6.04(u), 6.01(a)(iv), Permitted Acquisition (c)(iv)) arguably use the $150M cap, though gates that say 'compliance with ... Section 6.13' could be read either way."
    impact: "see variant V1 (ratio under the $150M cap) in checker output; RP grid tiering depends on it"
    owner: credit_officer / agent counsel
  - id: F4
    topic: Aerospace in, then out
    issue: "Ninth Amendment keeps Aerospace income in CNI for quarters ending before the Mar 16 2026 closing; pro forma disposition treatment then strips Aerospace EBITDA ($66.55M) out of the whole TTM. Borrower books the $1.05B sale gain as 'extraordinary/unusual' (cni.d) rather than (e)(ii). Same result, but the classification matters for the clause (e) 20% cap."
    impact: "see variant V4 in checker output"
    owner: credit_officer
  - id: F5
    topic: Clause (e) 20% cap is close
    issue: "Non-recurring costs ($15.96M) plus 'Permitted dispositions' ($0.84M) run close to the 20%-of-EBITDA cap on clause (e) exclusions. Mapping of each line to (e)(i)/(e)(iii) vs (a)(x) (uncapped deal fees) is inferred."
    impact: "see checks C1/C2 in checker output"
    owner: credit_officer
  - id: F6
    topic: Finance lease amount inferred
    issue: "10-Q gives finance leases only as '$1.0 million'. 1,040 is a residual chosen so the line items foot to the disclosed $161,040 net Total Indebtedness."
    owner: request compliance certificate
  - id: F7
    topic: Interest income differs between the two calcs
    issue: "EBITDA bridge deducts interest income of 13,130; Consolidated Cash Interest Expense nets 13,070. A 60K gap; immaterial but unexplained (definitions differ in scope: Receivables Subsidiary included in CCIE)."
    owner: request compliance certificate
  - id: F9
    topic: Missing March 4 2026 Consent
    issue: "Tenth Amendment recitals reference a Consent dated Mar 4 2026 that is not in the folder and not a 10-Q exhibit. Probably the Aerospace sale consent; could carry conditions on proceeds."
    owner: request from agent
  - id: F10
    topic: Specified Discontinued Operations date reference
    issue: "Definition cites a Form 8-K 'filed on November 5, 2024'; the Aerospace sale agreement is dated Nov 4 2025. Likely a drafting error (2025)."
    owner: credit_officer / agent counsel
  - id: F11
    topic: Covenant Holiday usage
    issue: "Number of Covenant Holiday Acquisitions used (max 2) is not disclosed. With $1.24B cash earmarked partly for acquisitions, a holiday election (4.50x) is plausible in coming quarters."
    owner: request from agent
  - id: F12
    topic: No equity cure
    issue: "No equity cure right found; a 6.12/6.13 breach is an immediate Event of Default under VII(d)."
    owner: credit_officer
