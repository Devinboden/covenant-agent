      - {id: cni.c, what: "accounting changes", quote: "(c) the cumulative effect of a change in accounting principles during such period"}
      - {id: cni.d, what: "extraordinary, nonrecurring or unusual items, net of fees", quote: "(d) any net extraordinary, nonrecurring or unusual gains or losses (less all fees and expenses relating thereto)"}
