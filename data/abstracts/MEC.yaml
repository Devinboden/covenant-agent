    name: Exhibit F Officer's Compliance Certificate (as amended by Annex B to the Third Amendment)
    status: missing
    why: "Annex B is referenced but not included in the filed exhibit"
    stand_in: data/reference/mercury-compliance-certificate-form.txt
  - id: schedule_1_1
    name: Schedule 1.1 Commitments (Annex A)
    status: missing
    why: "not in the filed exhibit; aggregate $275M is stated in the amendment"
  - id: specified_disposition_assets
    name: Specified Disposition asset list
    status: missing
    why: "identified privately to the lenders before closing"
    quote: "“Specified Disposition” means the transaction pursuant to which, among other things, the Credit Parties will dispose of certain assets previously identified to the Administrative Agent and the Lenders prior to the Third Amendment Effective Date."
  - id: schedule_9_1
    name: Schedule 9.1 Existing Indebtedness
    status: missing
