# ---------------------------------------------------------------- replay test
# MEC discloses only the reported ratios, not the calculation. No math replay is possible.
replay:
  - covenant: total_leverage
    test_date: 2026-06-30
    status: reported_only
    note: "10-Q gives the ratio and the cap only. Consolidated EBITDA (credit-agreement definition) and the debt build (finance leases, LCs, earn-outs) are not disclosed. Partial inputs listed below for a later replay once the compliance certificate is in hand (flag F5)."
    cap_basis: "agreement 9.15(a) table, Jun 30 2026 = 5.25x (relief regime; CAP not exited); matches the 10-Q"
    reported:
      ratio: 2.91
      cap: 5.25
      direction: max
      src: q2
      quote: "At June 30, 2026, our consolidated total leverage ratio under the Credit Agreement was 2.91 to 1.00 as compared to a covenant maximum of 5.25 to 1.00."
    partial_inputs:
      units: usd_thousands
      lines:
        - id: in.revolver
          value: 125718
          maps_to: ntd.i.total_debt
          src: q2
          quote: "The amount borrowed on the revolving credit notes was $125,718 and $202,525 as of June 30, 2026 and December 31, 2025, respectively."
        - id: in.fond_du_lac_note
          value: 1375
          maps_to: ntd.i.total_debt
          src: q2
          quote: "The balance outstanding as of June 30, 2026 and December 31, 2025 was $1,375."
        - id: in.cash
          value: -2203
          maps_to: ntd.ii.cash
          note: "below the $10M relief cap, so the cap does not bind; domestic/unrestricted split not disclosed"
          src: q2
          quote: "Cash and cash equivalents $2,203 $1,502"
        - id: in.finance_leases
          value: unknown
          maps_to: ntd.i.total_debt
          note: "only undiscounted contractual payments disclosed; balance-sheet liability not located"
          src: q2
          quote: "Finance lease obligations (3) 10,803 1,358 4,960 3,976 508"
        - id: in.letters_of_credit
          value: unknown
          maps_to: ntd.i.total_debt
        - id: in.consolidated_ebitda_ttm
          value: unknown
          maps_to: consolidated_ebitda
    variants_text:      # not computable by the checker (not_disclosed); recorded for graders
      - {id: V1, reading: "use the pre-relief 3.50x cap", result: "2.91x still passes"}
      - {id: V2, reading: "use the 10-Q headline 5.25x for Sep 30 2026", result: "wrong: Sep 30 2026 cap is 5.00x"}
  - covenant: interest_coverage
    test_date: 2026-06-30
    status: reported_only
    note: "10-Q gives the ratio and floor only; numerator (EBITDA - 50% capex - taxes +/- ESOP repurchases) and interest expense per the definition are not disclosed (flag F4)."
    cap_basis: "agreement 9.15(b) table, Jun 30 2026 = 2.75x (relief regime; CAP not exited); matches the 10-Q"
    reported:
      ratio: 3.27
      cap: 2.75
      direction: min
      src: q2
      quote: "At June 30, 2026, our consolidated interest coverage ratio under the Credit Agreement was 3.27 to 1.00 as compared to a covenant minimum of 2.75 to 1.00."
    variants_text:
      - {id: V1, reading: "use the pre-relief / post-early-exit 3.00x floor", result: "3.27x still passes, narrowly"}

# ---------------------------------------------------------------- judgment flags
flags:
  - id: F1
    topic: Early relief exit (clause (b)) status and trade-off
    issue: "On the reported Q2 2026 ratios (2.91x leverage, 3.27x ICR) the borrower appears to meet the pre-amendment covenants (3.50x / 3.00x). It may elect to end the CAP early; if it does, leverage locks at 3.50x and ICR at 3.00x, the relief restrictions fall away, and the Accu-Fab LIP is forfeited. The Q2 10-Q still compares against 5.25x / 2.75x, so we read it as NOT elected (inferred). Need the agent to confirm CAP status every quarter: it changes both caps and which negative-covenant baskets are open."
    impact: "Sep 30 2026 cap 5.00x (CAP running) vs 3.50x (exited); ICR floor 2.75x vs 3.00x"
    owner: setup_agent (status tracking) + credit_officer
  - id: F2
    topic: Does the Accu-Fab Leverage Increase Period resume after a scheduled (clause (a)) exit?
    issue: "Accu-Fab closed Jul 1 2025, so its LIP covered Q3'25-Q2'26. The Third Amendment suspends LIPs during the CAP and says the Accu-Fab LIP 'shall not be resumed' only if the CAP ends under clause (b), implying it does resume after a clause (a) exit. How many quarters remain (two, Q1'26 and Q2'26, were suspended) and from when is not stated."
    impact: "possible 4.00x instead of 3.50x for up to two quarters after the CAP ends (around Q2-Q3 2027)"
    owner: credit_officer + agent counsel
  - id: F3
    topic: Relief end is document-driven, not date-driven
    issue: "The CAP ends on DELIVERY of Q1 2027 statements showing compliance (due by May 15 2027), not on a calendar date. If those statements do not show compliance, the CAP 'shall continue' and the relief restrictions stay on indefinitely, while the covenant levels are 3.50x / 3.00x by then anyway. Abstracts that hard-code an end date will be wrong."
    owner: setup_agent (date logic) + human sign-off
  - id: F4
    topic: ICR is the tighter covenant and is falling
    issue: "Reported ICR fell from 5.47x (Dec 2025) to 4.27x (Mar 2026) to 3.27x (Jun 2026). The floor goes back up to 3.00x at Mar 31 2027. The numerator subtracts 50% of capex and capex is rising (FY2026 guide $25-35M, H1 $11.8M). The ICR calculation is not disclosed."
    owner: request compliance certificate
  - id: F5
    topic: Leverage not replayable
    issue: "No Consolidated EBITDA bridge or debt build in the 10-Q. The 10-Q Adjusted EBITDA (non-GAAP) uses a different definition (no 15% pool, no $10M lifetime cap). Total debt also includes finance leases, LC face amounts and earn-outs, which are not disclosed in covenant form."
    owner: request compliance certificate (Exhibit F as amended by Annex B, not public)
  - id: F6
    topic: 10-Q cap language is a headline, not the schedule
    issue: "Both 2026 10-Qs describe the covenant as 'not to exceed 5.25 to 1.00' and an ICR minimum of 2.75. The table gives 5.00x at Sep 30 2026 and 4.00x at Dec 31 2026. The Q1 2026 10-Q compares ICR to 2.75x, but the table row 'Closing Date through March 31, 2026' sets 3.00x for Mar 31 2026. The reported 4.27x passes either way, but an agent copying the 10-Q's cap would mis-set future tests."
    owner: setup_agent
  - id: F7
    topic: Add-back caps that need ledgers
    issue: "Cash add-backs under (v), (vii), (viii), (xi), (xii) and (xiii) share a 15%-of-EBITDA pool (pre-add-back basis). Clause (xi) is also capped at $7M per acquisition. New clause (xiv) (data-center start-up costs) has a $10M LIFETIME cap that has to be tracked across periods. Amounts used to date are not disclosed."
    owner: credit_officer
  - id: F8
    topic: Capex covenant and finance leases
    issue: "FY2026 capex limit is $40M with no carry-forward. Capital Expenditures include Capital Lease Obligations incurred; H1 2026 finance-lease ROU additions were $8.15M on top of $11.76M cash capex. Whether 'Capital Lease Obligations during such period' means new leases incurred (our reading) needs confirming."
    owner: credit_officer
  - id: F9
    topic: Relief-period acquisition basket
    issue: "Only one acquisition is allowed during the CAP: at most $25M, funded solely with Equity Issuance proceeds, at 3.25x or lower pro forma. The May 2026 equity raise went to revolver paydown, so equity used for any later deal must be newly raised or traced (open question)."
    owner: credit_officer
  - id: F10
    topic: Redline source and filing-label hygiene
    issue: "The conformed copy is a redline, and stricken text survives text extraction, so a deleted provision can pass the quote check (e.g. the old $50,000,000 capex limit, 'the consummation of the Accu-Fab Acquisition shall trigger a Leverage Increase Period'). Also: the 8-K exhibit index dates the Second Amendment 'August 15, 2026' (the amendment itself says 2025), and the manifest labels the Second Amendment '2026-02' (filing date)."
    owner: tooling (verify_abstract) + data steward
  - id: F11
    topic: Leverage Increase Periods used
    issue: "Max two over the term. Accu-Fab triggered one (First Amendment text; 10-K says the acquisition 'met these terms'), so one remains, usable only after the CAP. Whether a suspended and non-resumed Accu-Fab LIP still counts toward the two is not addressed."
    owner: credit_officer + agent
  - id: F12
    topic: Monthly reporting has no sunset
    issue: "8.1(d) monthly financials (added with the relief) is not tied to the CAP and has no end date (inferred from the text). Confirm whether lenders expect it to drop after relief."
    owner: relationship manager
  - id: F13
    topic: No pro forma for dispositions in EBITDA
    issue: "The EBITDA definition gives pro forma credit for acquisitions but has no matching removal of EBITDA for dispositions (only disposal gains and losses are excluded from CNI). The Specified Disposition and the held-for-sale Fond du Lac building could leave sold EBITDA in the TTM. Confirm the treatment with the agent."
    owner: credit_officer
