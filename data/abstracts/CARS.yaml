# ---------------------------------------------------------------- replay test
# The Q2 2026 10-Q reports the ratios but not Consolidated EBITDA or Consolidated Interest Expense,
# so no ratio can be rebuilt from disclosed components. Entries are kept so the checker records the
# reported numbers (quotes verified) and skips the math.
replay:
  - covenant: senior_secured_net_leverage
    test_date: 2026-06-30
    status: not_disclosed
    units: usd_thousands
    note: "Ratio reported; numerator inputs are on the balance sheet but the denominator (Consolidated EBITDA) is not disclosed (flag F3)."
    reported:
      ratio: 0.08
      cap: 3.50
      direction: max
      src: q2
      quote: "As of June 30, 2026, the Company's Senior Secured Net Leverage Ratio was 0.08 x and its Consolidated Interest Coverage Ratio was 7.20 x."
    numerator_inputs:      # disclosed, not summed by the checker
      - id: in.revolver
        value: 50000
        maps_to: ssnd.secured_indebtedness
        src: q2
        quote: "the Company had $50.0 million of outstanding borrowings"
      - id: in.cash
        value: -33287
        maps_to: ssnd.less.unrestricted_cash
        caveat: "consolidated cash; domestic share not disclosed (flag F4)"
        src: q2
        quote: "Cash and cash equivalents $33,287 $56,236"
      - id: in.letters_of_credit
        value: 0
        inferred: "revolver $350.0M - $50.0M drawn = $300.0M available, so no LCs reduce availability"
        src: q2
        quote: "As of June 30, 2026, $300.0 million was available to borrow under the revolving loan due in 2029"
    excluded_on_purpose:
      - {item: "6.375% Senior Unsecured Notes due 2028, $400.0M", why: "unsecured; counts only in Total Net Leverage"}
  - covenant: interest_coverage
    test_date: 2026-06-30
    status: not_disclosed
    note: "Only the ratio is reported. GAAP 'Interest expense, net' is disclosed but CIE (net of interest income, incl. fees) and Consolidated EBITDA are not."
    reported:
      ratio: 7.20
      cap: 3.00
      direction: min
      src: q2
      quote: "Consolidated Interest Coverage Ratio (as defined in the Credit Agreement) not to be below 3.0 x. As of June 30, 2026, the Company's Senior Secured Net Leverage Ratio was 0.08 x and its Consolidated Interest Coverage Ratio was 7.20 x."
  - covenant: rp_unlimited_tnlr_gate
    test_date: 2026-06-30
    status: not_disclosed
    note: "TNLR reported (1.95x) vs the 2.00x unlimited-RP gate; Consolidated EBITDA not disclosed."
    reported:
      ratio: 1.95
      cap: 2.00
      direction: max
      src: q2
      quote: "As of June 30, 2026, the Company's Total Net Leverage Ratio (as defined in the Credit Agreement) was 1.95 x."
    numerator_inputs:
      - id: in.debt_principal
        value: 450000
        maps_to: tnd.indebtedness
        note: "$400.0M notes + $50.0M revolver = carrying value $450.0M (in millions in the source)"
        src: q2
        quote: "Fair value $445.2 $454.1 Carrying value 450.0 455.0"
      - id: in.cash
        value: -33287
        maps_to: tnd.less.unrestricted_cash
        src: q2
        quote: "Cash and cash equivalents $33,287 $56,236"

# ---------------------------------------------------------------- judgment flags
flags:
  - id: F1
    topic: Source is a blackline, not a clean conformed copy
    issue: "Struck (deleted) text is still in the HTML, so tag-stripped text interleaves old and new (e.g. 7.07(g) '1.75 2.00 to 1.00'; struck ICR 2.75x step; old commitment fees in the pricing grid). Separately, page numbers fall inside sentences at page breaks (e.g. 7.12 '(y) 95 5.0%', 'Transaction 10 Costs'); they are not struck text and must be ignored, not read as deletions. The checker would accept a quote of deleted text. This abstract was cross-checked against a strike-removed copy, but the pipeline needs a strike-aware loader or a clean conformed copy."
    owner: engine (loader) + human sign-off
  - id: F2
    topic: Restricted payments vs the 2.00x unlimited-RP gate
    issue: "TNLR is 1.95x at Jun 30 2026 against a 2.00x pro forma gate for unlimited RPs under 7.07(g), while the company bought back $57.3M of stock in H1 2026. Which basket each buyback used ((e) $25M, (g) unlimited, (h) Available Amount at 4.25x) is not disclosed."
    evidence:
      src: q2
      quote: "During the six months ended June 30, 2026, we repurchased and subsequently retired 6.2 million shares for $57.3 million"
    impact: "checker (reported-only): 1.95x vs 2.00x, headroom 2.5% on the reported ratio; dollar headroom not computable (no EBITDA disclosed); TNLR rose from 1.84x (Mar 31) to 1.95x (Jun 30) per the 10-Qs"
    owner: credit_officer (request RP basket usage + Available Amount calc)
  - id: F3
    topic: No replayable components
    issue: "Neither Consolidated EBITDA nor Consolidated Interest Expense is disclosed, so no ratio can be rebuilt. The company also does not publish a non-GAAP Adjusted EBITDA in the Q2 10-Q."
    owner: request compliance certificate
  - id: F4
    topic: Domestic-only cash netting
    issue: "Unrestricted Cash counts only domestic cash of the Borrower and Domestic Subsidiaries (cap $125M). Cars.com has foreign operations (e.g. D2C Media); the 10-Q gives only consolidated cash. Q1 2026 reported senior secured net debt of $(9.6)M matches $55.0M revolver less all $64.6M consolidated cash, which suggests the borrower netted all cash (inferred, arithmetic not run by the checker)."
    evidence:
      src: q1
      quote: "Cash and cash equivalents $64,598 $56,236"
    owner: credit_officer
  - id: F5
    topic: Cash Equivalents undefined
    issue: "'Cash Equivalents' is capitalized but not defined anywhere in the conformed text (nor in the 2017 original). Treat as GAAP cash equivalents unless the agent says otherwise."
    owner: credit_officer / agent counsel
  - id: F6
    topic: Springing revolver maturity
    issue: "Revolver matures 91 days before the 2028 Senior Unsecured Notes maturity if any notes remain outstanding. Notes are 'due in 2028' with interest May 1 / Nov 1; the exact maturity date is not in the folder (Nov 1 2028 would give ~Aug 2 2028, inferred)."
    owner: credit_officer (pull the indenture)
  - id: F7
    topic: Negative numerator
    issue: "SSNLR was negative at Q1 2026 ((0.05)x). Engines must allow negative senior secured net debt and must not floor at zero; pricing grid Category 4 (<= 1.00x) applies."
    owner: setup_agent (engine)
  - id: F8
    topic: MD&A date inconsistency in Q2 10-Q
    issue: "Note 5 says TNLR 1.95x 'As of June 30, 2026'; MD&A says 'As of March 31, 2026 ... 1.95x', while the Q1 10-Q reported 1.84x at Mar 31. Treated as an MD&A typo; 1.95x is taken as the Jun 30 figure."
    evidence:
      src: q2
      quote: "As of March 31, 2026, our Total Net Leverage Ratio (as defined in the Credit Agreement) was 1.95x."
    owner: credit_officer
  - id: F9
    topic: Uncapped / odd add-backs
    issue: "Add-backs (g) transaction costs, (h) extraordinary/unusual/non-recurring and (u) other non-cash charges are uncapped; only (f)+(r) share a 20% cap and (i) litigation is capped at $2M. Clause (i) reads 'charges, expenses and gains', so gains appear inside an add-back."
    owner: credit_officer
  - id: F10
    topic: Step-up elections and Unrestricted Subsidiaries
    issue: "Whether any Material Permitted Acquisition step-up is active, and whether any Unrestricted Subsidiaries exist (Schedule 4.16), is not disclosed. The Q2 10-Q states the cap as 3.5x, consistent with no active step-up."
    owner: request from agent
  - id: F11
    topic: Leverage numerators use all Indebtedness, not just borrowed money
    issue: "No 'borrowed money' filter (contrast WEST): undrawn LCs, capital leases and guarantees count. Capital leases are Liens, so would count as secured debt. None appear outstanding today (inferred from $300.0M availability and no finance-lease disclosure)."
    owner: credit_officer
