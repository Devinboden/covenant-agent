<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Covenant review</title>
<style>
/* Layout: a two-pane checker desk. Left = the abstract and the decisions; right = the agreement page with the quote marked, like a reviewer's highlighter. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --sunk: #eaeef3;
  --ink: #17202b;
  --muted: #5a6574;
  --line: #d9dfe7;
  --accent: #0d5c75;
  --accent-soft: #e2eff3;
  --marker: rgba(255, 214, 10, 0.42);
  --marker-edge: #c99a00;
  --ok: #1d7a4e;
  --ok-soft: #e3f3ea;
  --warn: #9a5a00;
  --warn-soft: #fbf0dc;
  --bad: #b02a1f;
  --bad-soft: #fbe6e3;
  --defer: #5b6478;
  --defer-soft: #eceef3;
  --relief: #8a4bb0;
  --relief-soft: #f2e9f8;
  --shadow: 0 1px 2px rgba(23, 32, 43, .06), 0 4px 14px rgba(23, 32, 43, .06);
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1318; --surface: #151c24; --sunk: #1b232d; --ink: #e5eaf0; --muted: #98a4b3; --line: #29333f;
    --accent: #66b8d2; --accent-soft: #15303a; --marker: rgba(240, 196, 40, 0.30); --marker-edge: #e0b52c;
    --ok: #5cc791; --ok-soft: #13301f; --warn: #e5a54b; --warn-soft: #33260f; --bad: #f08578; --bad-soft: #3a1714;
    --defer: #a4adbf; --defer-soft: #232a35; --relief: #c495e3; --relief-soft: #2b1d36;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1318; --surface: #151c24; --sunk: #1b232d; --ink: #e5eaf0; --muted: #98a4b3; --line: #29333f;
  --accent: #66b8d2; --accent-soft: #15303a; --marker: rgba(240, 196, 40, 0.30); --marker-edge: #e0b52c;
  --ok: #5cc791; --ok-soft: #13301f; --warn: #e5a54b; --warn-soft: #33260f; --bad: #f08578; --bad-soft: #3a1714;
  --defer: #a4adbf; --defer-soft: #232a35; --relief: #c495e3; --relief-soft: #2b1d36;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.deal { display: flex; flex-direction: column; min-width: 0; }
.deal b { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
.deal span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipeline { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.stage { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.stage.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.stage.now { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.arrow { color: var(--line); }
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.who select { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.demo { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 2px 7px; border-radius: 4px; }

/* desk */
.desk { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0; min-height: calc(100% - 58px); }
.work { padding-block: 18px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.source { border-left: 1px solid var(--line); background: var(--sunk); position: sticky; top: 58px; height: calc(100vh - 58px); display: flex; flex-direction: column; min-width: 0; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fact { background: var(--surface); padding: 9px 12px; min-width: 0; }
.fact small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.fact div { font-size: 13.5px; overflow-wrap: anywhere; }

h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; text-wrap: balance; }
h2 em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.tab .n { font-family: var(--mono); font-size: 11px; background: var(--sunk); border-radius: 999px; padding: 1px 6px; margin-left: 4px; }

/* covenant cards */
.cov { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cov-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 14px 8px; }
.cov-head b { font-weight: 600; }
.ref { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.tag { font-size: 11.5px; color: var(--muted); }
.chart { padding: 0 14px 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 14px; border-top: 1px solid var(--line); }
td { padding: 7px 14px; border-top: 1px solid var(--line); vertical-align: top; }
tr.row { cursor: pointer; }
tr.row:hover td, tr.row.sel td { background: var(--accent-soft); }
td.v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
td.d { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.band { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.band.std { background: var(--sunk); color: var(--muted); }
.band.rel { background: var(--relief-soft); color: var(--relief); }
.checks { display: flex; flex-wrap: wrap; gap: 4px; }
.chk { font-size: 11px; color: var(--ok); background: var(--ok-soft); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.regime { padding: 10px 14px 12px; border-top: 1px solid var(--line); background: var(--relief-soft); font-size: 13px; display: grid; gap: 4px; }
.regime b { color: var(--relief); font-weight: 600; }

/* items */
.items { display: flex; flex-direction: column; gap: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; }
.item.sel { border-color: var(--accent); box-shadow: var(--shadow); }
.item[data-state="accept"] { border-left: 4px solid var(--ok); }
.item[data-state="correct"] { border-left: 4px solid var(--warn); }
.item[data-state="reject"] { border-left: 4px solid var(--bad); }
.item[data-state="defer"] { border-left: 4px solid var(--defer); }
.item-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.kind { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.kind.review { background: var(--accent-soft); color: var(--accent); }
.origin { font-size: 12px; color: var(--muted); }
.what { font-size: 14px; max-width: 68ch; }
blockquote { margin: 0; font-family: var(--text); font-size: 14.5px; line-height: 1.5; padding: 6px 10px; border-left: 3px solid var(--marker-edge); background: var(--sunk); border-radius: 0 4px 4px 0; overflow-wrap: anywhere; }
blockquote mark { background: var(--marker); color: inherit; padding: 0 1px; }
.nosrc { font-size: 12px; color: var(--muted); font-style: italic; }
.decide { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dbtn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
.dbtn:hover { border-color: var(--accent); }
.dbtn[aria-pressed="true"][data-d="accept"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.dbtn[aria-pressed="true"][data-d="correct"] { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.dbtn[aria-pressed="true"][data-d="reject"] { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.dbtn[aria-pressed="true"][data-d="defer"] { background: var(--defer-soft); color: var(--defer); border-color: var(--defer); }
.dbtn:disabled { opacity: .5; cursor: not-allowed; }
.fields { display: grid; gap: 6px; }
.fields input, .fields textarea { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.fields textarea { min-height: 52px; resize: vertical; }
.stamp { font-size: 12px; color: var(--muted); }

/* source pane */
.src-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.src-head .file { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pg { font-family: var(--mono); font-size: 12px; }
.nav { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 28px; height: 26px; cursor: pointer; }
.page-scroll { overflow: auto; flex: 1; padding: 16px; }
.page { position: relative; margin: 0 auto; max-width: 760px; background: #fff; box-shadow: var(--shadow); }
.page img { display: block; width: 100%; height: auto; }
.page[hidden], .no-pdf[hidden] { display: none; }
.no-pdf { max-width: 520px; margin: 40px auto; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 13.5px; }
.no-pdf b { color: var(--ink); font-weight: 600; }
.no-pdf blockquote { margin: 8px 0 0; padding: 10px 14px; border-left: 3px solid var(--line); background: var(--surface); color: var(--ink); font-family: Georgia, serif; }
.no-pdf blockquote:empty { display: none; }
.hl { position: absolute; background: rgba(255, 214, 10, 0.45); outline: 2px solid #d9a400; border-radius: 2px; mix-blend-mode: multiply; transition: opacity .2s; }
.src-cap { padding: 8px 14px; border-top: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--muted); }

/* action bar */
.actions { position: fixed; left: 0; bottom: 0; z-index: 6; width: 52.5%; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.prog { flex: 1; min-width: 160px; display: grid; gap: 4px; font-size: 12.5px; }
.meter { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .25s; }
.primary { background: var(--accent); color: var(--surface); border: 0; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.primary:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.ghost { background: none; border: 1px solid var(--line); padding: 7px 12px; border-radius: 6px; cursor: pointer; }
.confirm { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.msg { width: 100%; font-size: 13px; color: var(--bad); }
.msg.good { color: var(--ok); }

.trail { display: grid; gap: 6px; font-size: 13px; }
.trail div { display: grid; grid-template-columns: 92px 1fr; gap: 10px; }
.trail span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); max-width: 70ch; }

@media (max-width: 560px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .source { position: relative; top: 0; height: auto; border-left: 0; border-top: 1px solid var(--line); order: 2; }
  .page-scroll { max-height: 70vh; }
  .actions { width: 100%; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .work { padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 24px; }
  .pipeline { margin-left: 0; }
  .src-show { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* MCP App view: the host sizes the frame. Inline = stacked and height-capped; fullscreen = two panes filling the frame. */
body { padding-bottom: var(--safe-b, 0px); }
.who b { color: var(--ink); font-weight: 600; }
.loading { padding: 24px 16px; color: var(--muted); }
.actions { position: sticky; width: auto; bottom: var(--safe-b, 0px); }
.desk { min-height: 0; }
.source { top: var(--bar-h, 58px); height: calc(var(--frame-h, 100vh) - var(--bar-h, 58px) - var(--safe-b, 0px)); }
body.inline .desk { grid-template-columns: minmax(0, 1fr); }
body.inline .source { position: relative; top: 0; height: auto; border-left: 0; border-top: 1px solid var(--line); }
body.inline .page-scroll { max-height: 520px; }
body.inline .work { padding-bottom: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.fullscreen .work { max-height: calc(var(--frame-h, 100vh) - var(--bar-h, 58px) - var(--safe-b, 0px)); overflow: auto; padding-bottom: 0; }
body.fullscreen .actions { margin-top: auto; bottom: 0; }
.err { color: var(--bad); }
/* term-check context */
.why { font-size: 12.5px; color: var(--muted); margin: 2px 0 4px; }
.stored { display: grid; grid-template-columns: 1fr; gap: 4px; margin: 10px 0 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.stored > div { display: grid; grid-template-columns: 150px 1fr; gap: 8px; }
.stored dt { color: var(--muted); }
.stored dd { margin: 0; }
.defn { margin: 4px 0 8px; font-size: 12.5px; }
.defn summary { cursor: pointer; color: var(--accent, #1f5fbf); }
.defn table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.defn th, .defn td { text-align: left; vertical-align: top; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.defn td:nth-child(-n+3), .defn th:nth-child(-n+3) { white-space: nowrap; width: 1%; }
.defn tr.this td { background: rgba(255, 200, 60, .25); font-weight: 600; }
.defn tr.flagged td { background: rgba(255, 200, 60, .10); }
@media (max-width: 640px) { .stored > div { grid-template-columns: 1fr; } }
.corr-box { margin: 10px 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; display: grid; gap: 10px; }
.corr-head { color: var(--muted); }
.corr-box fieldset { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 12px; }
.corr-box legend { font-weight: 600; padding: 0 0 6px; }
.corr-box label { display: grid; gap: 4px; }
.corr-box label span { color: var(--muted); font-size: 12px; }
.corr-box input, .corr-box select { width: 100%; box-sizing: border-box; }
.corr-free { display: grid; gap: 6px; }
.corr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.changes { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.changes s { color: var(--muted); }
.changes small { color: var(--muted); margin-left: 6px; }
.gpt { margin: 6px 0; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; }
.gpt-ok { background: rgba(40, 160, 90, .10); }
.gpt-no { background: rgba(220, 120, 30, .14); }
.gpt-d { margin-top: 4px; color: var(--muted); }

/* ---- review levels, decision cards, covenant sheet ---- */
.ihead { font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.ihead b { color: var(--ink); font-family: var(--mono); }
.why-levels { flex-basis: 100%; font-size: 13px; }
.why-levels summary { cursor: pointer; color: var(--accent); }
.why-levels p { margin: 6px 0; max-width: 72ch; color: var(--ink); }
table.acc td, table.acc th, table.mini td, table.mini th { padding: 5px 8px; font-size: 12.5px; }
.group { display: grid; gap: 10px; }
.ghead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.ghead h2 { margin: 0; }
.done-group > summary { cursor: pointer; list-style: none; }
.done-group > summary h2 { margin: 0; }
.clist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.crow { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; align-items: start; }
.crow:first-child { border-top: 0; }
.crow.sel { background: var(--accent-soft); }
.csent { font-size: 13.5px; }
.cwhy { grid-column: 2; font-size: 12px; color: var(--muted); }
.cbtns { grid-column: 3; grid-row: 1 / span 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tier { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
.tier.t1 { background: var(--bad-soft); color: var(--bad); }
.tier.t2 { background: var(--accent-soft); color: var(--accent); }
.item small, .evid small { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.says p { margin: 0; font-family: var(--text); font-size: 16px; line-height: 1.7; max-width: 70ch; }
.says .fval { font-family: var(--mono); font-size: 14px; }
.asked p { margin: 0; font-size: 13.5px; max-width: 70ch; }
.asked .lw { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.inl { font-family: var(--mono); font-size: 14px; padding: 1px 5px; margin: 0 2px; border: 1px solid var(--line); border-bottom: 2px solid var(--accent); border-radius: 4px; background: var(--paper); max-width: 100%; }
select.inl { padding: 1px 2px; }
.inl.dirty { background: var(--warn-soft); border-color: var(--warn); }
.more summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.more[open] { display: grid; gap: 8px; }
.xfields { display: grid; gap: 6px; }
.xfields label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.xfields label span { min-width: 16ch; color: var(--muted); }
.q { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.q > b { font-size: 14px; }
.q textarea { width: 100%; min-height: 44px; resize: vertical; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.dbtn.yes { border-color: var(--ok); color: var(--ok); }
.dbtn.save:not(:disabled) { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.ghost.small { padding: 3px 9px; font-size: 12px; }
.stamp.accept { color: var(--ok); } .stamp.correct { color: var(--warn); } .stamp.reject { color: var(--bad); } .stamp.defer { color: var(--defer); }
.changes { margin: 0; padding-left: 18px; font-size: 13px; }
.sheet-intro { display: grid; gap: 2px; font-size: 14px; }
.sheet-intro b { font-size: 16px; }
.sheet-intro span { color: var(--muted); }
.sentence { margin: 0; padding: 0 14px 10px; font-family: var(--text); font-size: 16px; line-height: 1.55; max-width: 72ch; }
.sentence.sm { font-size: 13.5px; font-family: var(--ui); color: var(--muted); }
dl.sheet { margin: 0; border-top: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
.kv:first-child { border-top: 0; }
.kv dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.kv dd { margin: 0; min-width: 0; }
.kv dd p { margin: 0 0 4px; }
.formula { display: inline-grid; grid-template-columns: auto; text-align: center; font-size: 14px; margin-bottom: 6px; }
.formula .num { border-bottom: 1.5px solid var(--ink); padding: 0 8px 3px; }
.formula .div { display: none; }
.formula .den { padding: 3px 8px 0; }
.formula i { color: var(--muted); font-style: normal; }
ul.defs { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.capped { font-size: 12.5px; color: var(--warn); }
.sub { font-size: 12.5px; color: var(--muted); }
.pill { font-size: 12px; padding: 1px 7px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.muted { color: var(--muted); }
.sched { border-top: 1px solid var(--line); }
.sched > summary { cursor: pointer; padding: 9px 14px; font-size: 13px; color: var(--accent); }
.sched blockquote { margin: 8px 14px 12px; cursor: pointer; }
tr.ctx td { border-top: 0; padding-top: 0; font-size: 12px; color: var(--muted); font-family: var(--text); }
@media (max-width: 640px) { .kv { grid-template-columns: 1fr; gap: 2px; } .crow { grid-template-columns: auto 1fr; } .cbtns { grid-column: 1 / -1; grid-row: auto; justify-content: flex-start; } }
.pgtag { position: absolute; top: 6px; right: 8px; z-index: 2; font: 500 11px var(--mono); background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.pgtag.cited { color: var(--accent); border-color: var(--accent); }
.cnote { display: block; font-size: 12.5px; color: var(--ink); margin-top: 4px; padding: 4px 8px; background: var(--warn-soft); border-radius: 4px; }
.details-body { padding: 0 14px 12px; font-size: 13.5px; }
.lnk { cursor: pointer; color: var(--accent); }
.asked .rd { font-size: 13px; color: var(--muted); margin-top: 3px; }
/* one page, fitted to the pane */
.page-scroll { display: flex; justify-content: center; align-items: flex-start; position: relative; padding: 12px; min-height: 0; }
.page { height: 100%; max-width: 100%; width: auto; margin: 0; }
.page img { width: 100%; height: 100%; object-fit: contain; }
body.inline .page-scroll { height: 560px; max-height: none; }
.nav:disabled { opacity: .4; cursor: default; }
.src-cap a { color: var(--accent); margin-left: 6px; }
/* inline edit boxes: grow as you type, obvious when changed, pending card */
.inlwrap { display: inline-flex; align-items: baseline; gap: 6px; }
.inl { min-width: 6ch; transition: width .08s; }
.inl:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
.inl.dirty { background: #fff3c4; border-color: #b7791f; border-width: 2px; font-weight: 600; color: #1a1a1a; }
.inlhint { font: 600 13px var(--mono); color: #b7791f; white-space: nowrap; }
.item.pending { border-color: #b7791f; box-shadow: 0 0 0 2px #fff3c4; }
.dbtn.save:not(:disabled) { background: #b7791f; color: #fff; border-color: #b7791f; font-weight: 600; }
/* card actions: one main button, small links */
.act { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
.act .go { min-width: 110px; }
.act .go.saving { background: #b7791f; }
.act .links { display: flex; gap: 14px; font-size: 13px; }
.act .links a, .small-link { color: var(--accent); text-decoration: none; font-size: 13px; }
.act .links a:hover, .small-link:hover { text-decoration: underline; }
textarea.note { width: 100%; min-height: 44px; resize: vertical; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.item.done { padding: 9px 14px; gap: 4px; cursor: pointer; }
.item.done .item-top { gap: 6px 12px; }
.donenote { font-size: 13px; color: var(--ink); background: var(--sunk); border-radius: 4px; padding: 3px 8px; }
.evpiece { cursor: pointer; display: grid; gap: 3px; margin-top: 6px; }
.evpiece:hover blockquote { outline: 1px solid var(--accent); }
.approver { border: 2px solid var(--accent); border-radius: 8px; padding: 12px 14px; background: var(--accent-soft); }
.alist { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }
.alist small { display: block; color: var(--muted); }
/* one-line explanation; values read as text until clicked */
.explain { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--sunk); border-left: 3px solid var(--accent); padding: 6px 10px; border-radius: 0 4px 4px 0; }
.cexp { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.val { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; border-bottom: 1px dashed var(--accent); padding: 0 1px; cursor: text; }
.val:hover { background: var(--accent-soft); }

/* ===================== Design system (2026-11-04) =====================
   A checker's desk: the abstract on the left, the agreement on the right. Quiet neutrals; the one strong colour is
   the highlighter yellow that ties a card's evidence to the marked page. Sans for the app, serif only for text quoted
   from the agreement. Sentence case, no all-caps labels, no monospace labels. Scale: 4 8 12 16 24 32. */
:root {
  --paper: #f5f5f6; --surface: #ffffff; --sunk: #f4f4f5; --ink: #18181b; --muted: #6b6b76; --line: #e4e4e7;
  --accent: #18181b; --accent-soft: #f4f4f5; --focus: #2563eb;
  --marker: #fde68a; --marker-edge: #ca8a04;
  --ok: #15803d; --ok-soft: #ecfdf3; --warn: #b45309; --warn-soft: #fff7e6; --bad: #b42318; --bad-soft: #fef3f2;
  --defer: #6b6b76; --defer-soft: #f4f4f5; --relief: #7c3aed; --relief-soft: #f5f3ff;
  --shadow: 0 1px 2px rgba(24, 24, 27, .05);
  --r-sm: 6px; --r: 10px;
  --text: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f0f11; --surface: #18181b; --sunk: #232327; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33;
  --accent: #f4f4f5; --accent-soft: #232327; --marker: rgba(250, 204, 21, .32); --marker-edge: #eab308;
  --ok: #4ade80; --ok-soft: #12261a; --warn: #f59e0b; --warn-soft: #2a1f0b; --bad: #f87171; --bad-soft: #2a1414; } }
:root[data-theme="dark"] {
  --paper: #0f0f11; --surface: #18181b; --sunk: #232327; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33;
  --accent: #f4f4f5; --accent-soft: #232327; --marker: rgba(250, 204, 21, .32); --marker-edge: #eab308;
  --ok: #4ade80; --ok-soft: #12261a; --warn: #f59e0b; --warn-soft: #2a1f0b; --bad: #f87171; --bad-soft: #2a1414; }
body { font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
.bar { padding: 12px 20px; gap: 16px; }
.deal b { font-size: 15px; font-weight: 600; }
.deal span { font-size: 12.5px; }
.stage { font-size: 12.5px; border-radius: 999px; padding: 3px 10px; }
.stage.now { background: var(--ink); color: var(--surface); font-weight: 500; }
.stage.done { background: var(--ok-soft); color: var(--ok); }

/* facts: a quiet strip, not a grid of boxes */
.facts { background: none; border: 0; border-radius: 0; gap: 4px 24px; padding: 0 2px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fact { background: none; padding: 0; }
.fact small { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--muted); }
.fact div { font-size: 13.5px; font-weight: 500; }

/* tabs */
.tabs { gap: 20px; }
.tab { padding: 8px 2px; font-weight: 500; }
.tab[aria-selected="true"] { border-color: var(--ink); }
.tab .n { font-family: var(--ui); background: var(--sunk); color: var(--muted); }

/* section headings: sentence case + count, one line of guidance */
h2 { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 600; color: var(--ink); margin: 0; display: flex; align-items: center; gap: 8px; }
.count { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--sunk); border-radius: 999px; padding: 1px 8px; }
.gsub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.group { gap: 12px; }
.ghead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; row-gap: 0; }
.ghead .gsub { flex-basis: 100%; order: 3; }
.done-group > summary { list-style: none; }
.done-group > summary::-webkit-details-marker { display: none; }

/* cards */
.item { border-radius: var(--r); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px 18px; gap: 12px; }
.item.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.item.pending { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
.item[data-state] { border-left-width: 1px; }
.ch { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ch h3, .item-top h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
.tier { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 500; padding: 0; background: none !important;
  color: var(--muted) !important; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tier::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.tier.t1::before { background: var(--bad); }
.explain { background: none; border: 0; padding: 0; margin: -6px 0 0; color: var(--muted); font-size: 13.5px; max-width: 72ch; }

/* the comparison: Abstract vs Agreement, labels aligned in one column */
.rows { margin: 0; display: grid; gap: 10px; }
.rows .r { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: start; }
.rows dt { font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.rows dd { margin: 0; min-width: 0; }
.says p { font-family: var(--ui); font-size: 14.5px; line-height: 1.6; margin: 0; max-width: 70ch; }
.says .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.val { border-bottom: 1px dashed var(--muted); font-weight: 600; }
.val:hover { background: var(--sunk); border-bottom-color: var(--ink); }
.mnote { font-size: 13.5px; color: var(--ink); }
.evid { display: grid; gap: 8px; }
.evpiece { all: unset; display: grid; gap: 4px; cursor: pointer; border-radius: var(--r-sm); padding: 2px 0; }
.evpiece:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.evpiece q { font-family: var(--text); font-size: 15px; line-height: 1.6; quotes: "\201C" "\201D"; max-width: 70ch; }
.evpiece mark { background: var(--marker); color: inherit; padding: 1px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.evpiece:hover mark { box-shadow: 0 0 0 1px var(--marker-edge); }
.evcap { font-size: 12px; color: var(--muted); }
.evpiece:hover .evcap { color: var(--ink); text-decoration: underline; }
.more summary { color: var(--muted); font-size: 13px; }

/* actions: one primary button, quiet links */
.act { border-top: 1px solid var(--line); padding-top: 12px; gap: 16px; }
.primary { background: var(--ink); color: var(--surface); border-radius: var(--r-sm); padding: 8px 16px; font-weight: 500; font-size: 13.5px; }
.primary:hover { opacity: .9; }
.act .go.saving { background: var(--warn); color: #fff; }
.act .links a, .small-link { color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.act .links a:hover, .small-link:hover { color: var(--ink); text-decoration-color: currentColor; }
.dbtn { border-radius: var(--r-sm); border-color: var(--line); font-weight: 500; font-size: 13px; padding: 6px 12px; }
.dbtn:hover { background: var(--sunk); border-color: var(--line); }
.inl { border: 1px solid var(--ink); border-radius: var(--r-sm); background: var(--surface); }
.inl.dirty { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }
.inlhint { font-family: var(--ui); color: var(--warn); }

/* quick confirm list */
.clist { border-radius: var(--r); border-color: var(--line); background: var(--surface); box-shadow: var(--shadow); }
.crow { grid-template-columns: minmax(0, 1fr) auto; padding: 12px 16px; gap: 4px 16px; }
.crow .ref { grid-column: 1; font-family: var(--ui); font-size: 14px; font-weight: 600; color: var(--ink); }
.csent { grid-column: 1; font-size: 13.5px; }
.cexp { color: var(--muted); }
.cbtns { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
.crow.sel { background: var(--sunk); }

/* decided cards and the approver box */
.item.done { padding: 10px 16px; }
.stamp { font-size: 12.5px; }
.stamp.accept, .stamp.correct { color: var(--ok); }
.approver { background: var(--surface); border: 1px solid var(--ink); border-radius: var(--r); }

/* footer bar and source pane */
.actions { padding: 12px 20px; }
.meter { height: 4px; }
.meter i { background: var(--ink); }
.src-head { padding: 10px 16px; }
.src-head .file { font-family: var(--ui); }
.pg { font-family: var(--ui); font-variant-numeric: tabular-nums; }
.nav { border-radius: var(--r-sm); }
.hl { background: rgba(250, 204, 21, .38); outline: 1.5px solid var(--marker-edge); }
.src-cap { font-size: 12.5px; }
@media (max-width: 640px) { .rows .r { grid-template-columns: 1fr; gap: 2px; } .crow { grid-template-columns: 1fr; } .cbtns { grid-column: 1; grid-row: auto; } }
.val.dirty { background: var(--warn-soft); border-bottom: 2px solid var(--warn); color: var(--ink); border-radius: 3px 3px 0 0; padding: 0 3px; }
.evpiece q { quotes: none; }
.item.sel { border-color: var(--ink); box-shadow: none; }
/* highlight lives on the agreement page only; the card shows the passage as plain document text */
.evpiece mark { background: none; padding: 0; color: inherit; }
.evpiece:hover mark { box-shadow: none; }
/* tabs first and pinned to the top of the left pane while it scrolls */
.work { padding-top: 0; }
.tabs { position: sticky; top: 0; z-index: 4; background: var(--paper); margin: 0 -16px; padding: 14px 16px 0; box-shadow: 0 1px 0 var(--line); }
body.inline .tabs { top: var(--bar-h, 58px); }
/* children of the scrolling pane keep their natural height (the facts strip was being squeezed to 0) */
.work > * { flex-shrink: 0; }
.facts { overflow: visible; }
/* definitions open into their items */
.defitem > summary { cursor: pointer; list-style: none; }
.defitem > summary::-webkit-details-marker { display: none; }
.defitem > summary::before { content: "▸"; display: inline-block; width: 1em; color: var(--muted); }
.defitem[open] > summary::before { content: "▾"; }
.defs-t { margin: 6px 0 10px; }
.defs-t td { vertical-align: top; }
.deftext { font-family: var(--text); font-size: 13px; color: var(--muted); margin-top: 2px; }
/* covenants tab in the same system */
.sheet-intro b { font-size: 15px; font-weight: 600; }
.sheet-intro span { font-size: 13.5px; }
.cov { border-radius: var(--r); border-color: var(--line); box-shadow: var(--shadow); }
.cov-head { padding: 16px 18px 6px; }
.cov-head b { font-size: 15px; }
.cov-head .ref { font-family: var(--ui); color: var(--muted); }
.tag { color: var(--muted); }
.sentence { font-family: var(--ui); font-size: 14.5px; line-height: 1.6; padding: 0 18px 14px; color: var(--ink); }
.kv { grid-template-columns: 140px minmax(0, 1fr); padding: 10px 18px; }
.kv dt { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--muted); }
.kv dd .mono, .mono { font-family: var(--ui); font-variant-numeric: tabular-nums; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.sched > summary { color: var(--muted); padding: 10px 18px; }
.details-body { padding: 0 18px 14px; }
th { text-transform: none; letter-spacing: 0; font-size: 12px; }
.chk { background: none; color: var(--ok); padding: 0; }
/* definition rows: click to see the clause; the defined term and the words that make it count are marked too */
.defrow { cursor: pointer; }
.defrow:hover td { background: var(--hover, rgba(0,0,0,.035)); }
.hl.hl-name { background: rgba(59, 130, 246, .28); outline: 1.5px solid #2563eb; }
.hl.hl-lead { background: rgba(34, 197, 94, .28); outline: 1.5px solid #16a34a; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-size: 12px; }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
.legend .sw.cl { background: rgba(250, 204, 21, .6); outline: 1px solid #d9a400; }
.legend .sw.name { background: rgba(59, 130, 246, .45); outline: 1px solid #2563eb; }
.legend .sw.lead { background: rgba(34, 197, 94, .45); outline: 1px solid #16a34a; }
.dealrec { margin-bottom: 18px; }
/* Done cards: one quiet border on every side; the green stamp carries the state. Selected = light fill, not an outline */
.item.done, .item.done[data-state] { border: 1px solid var(--line); }
.item.done.sel { border-color: var(--line); box-shadow: var(--shadow); background: var(--sunk); }
</style>

</head>
<body>


<header class="bar">
  <div class="deal"><b id="dealName">Loading review…</b><span id="dealSub"></span></div>
  <div class="pipeline" aria-label="Sign-off status">
    <span class="stage" id="stDraft">Draft</span><span class="arrow">→</span>
    <span class="stage" id="stVer">Verified</span><span class="arrow">→</span>
    <span class="stage" id="stSign">Signed off</span>
  </div>
  <div class="who"><span>Signed in as</span> <b id="viewer">—</b>
    <button class="ghost" id="fsBtn" hidden>Full screen</button></div>
</header>

<main class="desk">
  <section class="work">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-items" aria-selected="true">Open items<span class="n" id="nOpen"></span></button>
      <button class="tab" role="tab" id="tab-cov" aria-selected="false">Covenants</button>
      <button class="tab" role="tab" id="tab-trail" aria-selected="false">Trail</button>
    </div>
    <div class="facts" id="facts"></div>
    <div id="view-items" class="items"></div>
    <div id="view-cov" hidden></div>
    <div id="view-trail" hidden></div>
    <div class="loading" id="loading">Waiting for the review data from the host…</div>
    <footer class="actions" id="actions">
      <div class="prog"><div id="progText"></div><div class="meter"><i id="meter"></i></div></div>
      <button class="primary" id="mainBtn"></button>
      <div class="confirm" id="confirm" hidden></div>
      <div class="msg" id="msg" hidden></div>
    </footer>
  </section>

  <aside class="source" aria-label="Source document">
    <div class="src-head">
      <button class="nav" id="prev" aria-label="Previous cited page">‹</button>
      <span class="pg" id="pgLabel"></span>
      <button class="nav" id="next" aria-label="Next cited page">›</button>
      <span class="file" id="file"></span>
    </div>
    <div class="page-scroll" id="scroller"><div class="page" id="page" hidden><img id="pageImg" alt=""></div>
      <div class="no-pdf" id="noPdf" hidden><b>Agreement pages aren't available on this server.</b><span>The decisions and quotes still work; the quote for the selected item is shown here.</span><blockquote id="noPdfQuote"></blockquote></div></div>
    <div class="src-cap" id="cap">Select a row or an item to see where it comes from.</div>
